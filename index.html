<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr. Writer</title>
  <style>
    :root {
      --bg: #141416;
      --card: #1f1f23;
      --border: #2e2e34;
      --accent: #e5484d;
      --text: #f1f1f3;
      --muted: #8b8b99;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; }
    .brand span { color: var(--accent); }
    .status { font-size: 0.75rem; color: var(--muted); }

    .layout { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    @media (min-width: 768px) { .layout { flex-direction: row; } }

    /* Editor Area */
    .editor-section {
      flex: 1;
      display: flex;
      overflow-y: auto;
      padding: 12px;
      gap: 10px;
    }
    .syllables-rail {
      width: 28px;
      color: var(--muted);
      font-size: 12px;
      line-height: 24px;
      text-align: right;
      user-select: none;
      padding-top: 2px;
    }
    #lyrics-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      line-height: 24px;
      resize: none;
      white-space: pre-wrap;
    }

    /* Reference & Tools Drawer */
    .toolbox {
      height: 48%;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      .toolbox { height: 100%; width: 380px; border-top: none; border-left: 1px solid var(--border); }
    }

    .search-row { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--border); }
    .search-row input {
      flex: 1;
      padding: 8px 12px;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
    .search-row select, .search-row button {
      background: #2a2a30;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .search-row button { background: var(--accent); border: none; font-weight: 600; }

    .filter-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .results-grid {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
    }
    .word-chip {
      background: #18181c;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .word-chip span { color: var(--muted); font-size: 10px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">Mr. <span>Writer</span></div>
    <div class="status" id="save-status">Saved</div>
  </header>

  <div class="layout">
    <div class="editor-section">
      <div class="syllables-rail" id="syllables-rail">1</div>
      <textarea id="lyrics-input" placeholder="Type or paste lyrics here... Select or double-tap a word to research it."></textarea>
    </div>

    <div class="toolbox">
      <div class="search-row">
        <input type="text" id="query" placeholder="Search reference...">
        <button onclick="runSearch()">Find</button>
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active" data-mode="rel_rhy">Rhymes</button>
        <button class="filter-btn" data-mode="rel_nry">Near Rhymes</button>
        <button class="filter-btn" data-mode="rel_syn">Synonyms</button>
        <button class="filter-btn" data-mode="rel_trg">Associations</button>
        <button class="filter-btn" data-mode="rel_bga">Phrases</button>
      </div>

      <div class="results-grid" id="results">
        <span style="color:var(--muted); font-size:13px;">Double-tap a word in your lyrics or search above.</span>
      </div>
    </div>
  </div>

  <script>
    const textarea = document.getElementById('lyrics-input');
    const syllablesRail = document.getElementById('syllables-rail');
    const saveStatus = document.getElementById('save-status');
    const resultsGrid = document.getElementById('results');
    const queryInput = document.getElementById('query');
    let currentMode = 'rel_rhy';

    // Load saved song
    textarea.value = localStorage.getItem('mrwriter_lyrics') || '';
    updateSyllables();

    // Naive syllable counter per line
    function countWordSyllables(word) {
      word = word.toLowerCase().replace(/[^a-z]/g, '');
      if (!word) return 0;
      if (word.length <= 3) return 1;
      word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
      word = word.replace(/^y/, '');
      const match = word.match(/[aeiouy]{1,2}/g);
      return match ? match.length : 1;
    }

    function updateSyllables() {
      const lines = textarea.value.split('\n');
      syllablesRail.innerHTML = lines.map(line => {
        if (!line.trim()) return '&nbsp;';
        const words = line.trim().split(/\s+/);
        const count = words.reduce((acc, w) => acc + countWordSyllables(w), 0);
        return count;
      }).join('<br>');
    }

    // Auto-save and syllable update
    let debounceTimer;
    textarea.addEventListener('input', () => {
      saveStatus.textContent = 'Editing...';
      updateSyllables();
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        localStorage.setItem('mrwriter_lyrics', textarea.value);
        saveStatus.textContent = 'Saved';
      }, 700);
    });

    // Handle reference filter tab changes
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        if (queryInput.value.trim()) runSearch();
      });
    });

    async function runSearch(manualTerm) {
      const term = manualTerm || queryInput.value.trim();
      if (!term) return;
      queryInput.value = term;

      resultsGrid.innerHTML = '<span style="color:var(--muted); font-size:13px;">Searching Mr. Writer index...</span>';

      try {
        const res = await fetch(`https://api.datamuse.com/words?${currentMode}=${encodeURIComponent(term)}&max=80`);
        const data = await res.json();
        resultsGrid.innerHTML = '';

        if (!data.length) {
          resultsGrid.innerHTML = '<span style="color:var(--muted); font-size:13px;">No entries found.</span>';
          return;
        }

        data.forEach(item => {
          const chip = document.createElement('div');
          chip.className = 'word-chip';
          chip.innerHTML = `${item.word} <span>${item.numSyllables ? item.numSyllables + 's' : ''}</span>`;
          chip.onclick = () => insertWord(item.word);
          resultsGrid.appendChild(chip);
        });
      } catch (e) {
        resultsGrid.innerHTML = '<span style="color:var(--accent); font-size:13px;">Connection error.</span>';
      }
    }

    function insertWord(word) {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      textarea.value = text.substring(0, start) + word + text.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + word.length;
      textarea.focus();
      updateSyllables();
    }

    // Lookup on select / double click
    textarea.addEventListener('dblclick', () => {
      const selection = window.getSelection().toString().trim();
      if (selection) runSearch(selection);
    });
  </script>
</body>
</html>
