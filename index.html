<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">Hook & Line</title>

  <!-- PWA & Adaptive App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="android-pwa-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="android-pwa-192.png">
  <link rel="shortcut icon" href="android-pwa-192.png">
  <link rel="apple-touch-icon" href="android-playstore-512.png">
  <meta name="theme-color" content="#13141a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- PDF.js library for client-side PDF text extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg: #0b0c10;
      --surface: #13141a;
      --surface-2: #1b1d26;
      --surface-3: #242735;
      --border: #222533;
      --border-light: #2d3142;
      --accent: #e54245;
      --accent-glow: rgba(229, 66, 69, 0.35);
      --chord-color: #9aa3be;
      --section-color: #ffd166;
      --text: #f3f4f8;
      --muted: #787d95;
      --editor-line-height: 38px;
    }

    body.hide-chords {
      --editor-line-height: 26px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; }

    /* Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }
    #splash-screen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-logo { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); object-fit: cover; }
    .splash-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
    .splash-title span { color: var(--accent); }
    .splash-tagline { font-size: 13px; color: var(--muted); }

    /* Top Studio Bar */
    header {
      height: 50px;
      padding: 0 10px;
      background: rgba(19, 20, 26, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      z-index: 50;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    .song-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      max-width: 100%;
      min-width: 0;
      transition: border-color 0.2s;
    }
    .song-pill:active { border-color: var(--accent); }
    .song-title-text { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .version-tag { font-size: 10px; background: var(--surface-3); color: #a4abbd; padding: 1px 5px; border-radius: 4px; flex-shrink: 0; font-weight: 600; }

    .header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    .icon-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }
    .icon-btn:active { background: var(--surface-3); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-accent:active { opacity: 0.9; }
    .btn-toggle-active { background: #1f2538; border-color: #3f496e; color: #8ec2ff; }
    .btn-recording { background: var(--accent) !important; color: #fff !important; animation: pulse-red 1.2s infinite ease-in-out; }
    .btn-ai { background: #261f38; border-color: #553e80; color: #d6b4ff; }
    .btn-ai:hover { border-color: #7b55be; }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(229, 66, 69, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(229, 66, 69, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 66, 69, 0); }
    }

    /* Voice Memo Bar */
    .memo-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: #141724;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      flex-shrink: 0;
    }
    .memo-bar.visible { display: flex; }
    .memo-bar audio { height: 26px; flex: 1; outline: none; }
    .memo-btn {
      background: var(--surface-3);
      border: 1px solid var(--border-light);
      color: #ff7579;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    /* Collapsible Chords Strip */
    .chord-strip-container {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .chord-strip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .chord-collapse-toggle {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .chord-strip-content {
      display: flex;
      gap: 5px;
      padding: 2px 10px 6px 10px;
      overflow-x: auto;
      white-space: nowrap;
      align-items: center;
    }
    .chord-strip-container.collapsed .chord-strip-content { display: none; }
    .chord-divider { width: 1px; height: 18px; background: var(--border-light); margin: 0 2px; flex-shrink: 0; }

    .chord-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--chord-color);
      font-weight: 700;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chord-pill:active { background: var(--accent); color: #fff; }
    .chord-pill-delete { background: #261517; border-color: #4f1d21; color: #ff8589; }

    /* Workspace & Editor */
    .workspace { display: flex; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; position: relative; }

    .editor-section {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .meter-rail {
      width: 36px;
      background: rgba(0,0,0,0.18);
      border-right: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-family: monospace;
      text-align: right;
      padding: 14px 6px 0 0;
      user-select: none;
      overflow: hidden;
      flex-shrink: 0;
    }
    .meter-item {
      display: block;
      height: var(--editor-line-height);
      line-height: var(--editor-line-height);
      transition: height 0.15s ease, line-height 0.15s ease;
    }
    .meter-item.section-spacer { height: 28px; line-height: 28px; color: transparent; }

    #editor-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 16px 28px 16px;
      outline: none;
      font-size: 16px;
      line-height: var(--editor-line-height);
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      position: relative;
      transition: line-height 0.15s ease;
    }

    #editor-content:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
      pointer-events: none;
      display: block;
    }

    .editor-footer-stats {
      position: absolute;
      bottom: 4px;
      left: 42px;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
      background: rgba(11, 12, 16, 0.85);
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 5;
    }

    /* Section Header Pills */
    .section-header-tag {
      display: block;
      width: fit-content;
      margin: 12px 0 4px 0;
      padding: 2px 8px;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.35);
      color: var(--section-color);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 4px;
      line-height: 18px;
      height: 22px;
      user-select: none;
      cursor: pointer;
    }

    /* Inline Placed Chords */
    .chord-badge {
      display: inline-block;
      position: relative;
      vertical-align: baseline;
      width: 0;
      overflow: visible;
      user-select: none;
    }
    body.hide-chords .chord-badge { display: none !important; }

    .chord-badge-inner {
      position: absolute;
      bottom: 14px;
      left: 0;
      font-size: 11px;
      font-weight: 700;
      font-family: monospace;
      color: var(--chord-color);
      background: #1b1d28;
      border: 1px solid #35384b;
      border-radius: 4px;
      padding: 0 4px;
      line-height: 16px;
      height: 16px;
      white-space: nowrap;
      cursor: pointer;
      transform: translateX(-50%);
    }

    .chord-badge.selected .chord-badge-inner {
      background: var(--accent);
      border-color: #ff7b80;
      color: #fff;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* Floating Action Pin */
    .floating-actions {
      position: absolute;
      top: 10px;
      right: 14px;
      display: none;
      z-index: 100;
      gap: 6px;
    }
    .floating-btn {
      background: var(--accent);
      color: #fff;
      border: 1px solid #ff7b80;
      border-radius: 18px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
      cursor: pointer;
    }
    .floating-btn-tag {
      background: #282415;
      border-color: var(--section-color);
      color: var(--section-color);
    }

    /* Reference Drawer */
    .reference-suite {
      height: 44%;
      min-height: 110px;
      max-height: 75%;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      z-index: 10;
      position: relative;
      flex-shrink: 0;
    }

    .resize-handle {
      width: 100%;
      height: 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      cursor: row-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      flex-shrink: 0;
    }
    .resize-handle::after {
      content: "";
      width: 32px;
      height: 3px;
      background: var(--border-light);
      border-radius: 2px;
    }

    /* Studio Search Dock with Language Toggle */
    .search-dock {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .lang-toggle-wrap {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      flex-shrink: 0;
    }
    .lang-opt {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-opt.active {
      background: var(--surface-3);
      color: #fff;
    }

    .search-dock input {
      flex: 1;
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .search-dock input:focus { border-color: var(--border-light); }

    /* Studio Mode Navigation */
    .category-pills {
      display: flex;
      gap: 5px;
      padding: 5px 10px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .category-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .category-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    
    .category-btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
      border-style: dashed;
    }

    /* Alliteration A-Z Sub-Bar */
    .alliteration-strip {
      display: none;
      padding: 4px 10px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      gap: 4px;
      flex-shrink: 0;
    }
    .alliteration-strip.visible { display: flex; }
    .letter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      width: 22px;
      height: 22px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .letter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Collected Ideas Bar */
    .collected-dock {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #0f1016;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      font-size: 11px;
      flex-shrink: 0;
    }
    .collected-label { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 9px; letter-spacing: 0.5px; }
    .collected-chip {
      background: var(--surface-2);
      color: #9ac7ff;
      border: 1px solid #333a4f;
      padding: 2px 7px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .collected-chip .remove-chip { color: var(--muted); font-weight: bold; }

    .dictionary-feed { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .syllable-group-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .syllable-group-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    
    .chips-cluster { display: flex; flex-wrap: wrap; gap: 5px; }

    .word-card { 
      background: var(--surface-2); 
      border: 1px solid var(--border); 
      border-radius: 5px; 
      padding: 4px 8px; 
      font-size: 13px; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      user-select: none;
    }
    .word-card:active { background: var(--accent); color: #fff; }
    .word-card span { font-size: 10px; color: var(--muted); font-family: monospace; }
    .word-card .collect-btn { color: var(--muted); font-size: 12px; }

    .phrase-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .phrase-card:active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Popovers & Modals */
    .popover-menu {
      position: fixed;
      background: var(--surface-2);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      z-index: 300;
      display: none;
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      overflow: hidden;
    }
    .popover-item {
      padding: 10px 14px;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .popover-item:last-child { border-bottom: none; }
    .popover-item:active { background: var(--surface-3); }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 200; }
    .overlay.active { display: flex; }
    .dialog { background: var(--surface); border: 1px solid var(--border-light); border-radius: 12px; width: 100%; max-width: 440px; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; }
    .dialog-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    
    .catalog-actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      gap: 6px;
    }
    .dialog-body { flex: 1; overflow-y: auto; padding: 10px 12px; }

    .song-row {
      padding: 9px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .song-row.active { border-color: var(--accent); }
    .song-checkbox { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .song-info { flex: 1; overflow: hidden; }
    .song-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-edit-song { background: transparent; border: 1px solid var(--border-light); color: var(--muted); border-radius: 5px; padding: 3px 6px; font-size: 11px; cursor: pointer; }
    .btn-edit-song:hover { color: #fff; border-color: var(--accent); }
    .btn-delete-song { background: transparent; border: 1px solid #4a2125; color: #ff6b70; border-radius: 5px; padding: 3px 6px; font-size: 11px; cursor: pointer; }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(27, 29, 38, 0.95); border: 1px solid var(--border-light); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 16px; z-index: 500; display: none; }

    /* Print Output */
    #all-songs-print-container { display: none; }
    .song-print-block { page-break-after: always; padding: 24px 0; }
    .song-print-block:last-child { page-break-after: auto; }
    .song-print-title { font-size: 24px; font-weight: 800; margin-bottom: 16px; color: #000; border-bottom: 2px solid #ddd; padding-bottom: 6px; }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      header, .chord-strip-container, .meter-rail, .reference-suite, .floating-actions, .overlay, .popover-menu, #toast, #splash-screen, .editor-footer-stats, .memo-bar { display: none !important; }
      #editor-content { display: none !important; }
      #all-songs-print-container { display: block !important; padding: 0 !important; }
      .section-header-tag { color: #885e00 !important; background: transparent !important; border: 1px solid #885e00 !important; font-size: 11px !important; }
      .chord-print-label { color: #555 !important; font-size: 11px !important; font-weight: 700 !important; font-family: monospace !important; }
      .lyric-print-text { color: #000 !important; font-size: 15px !important; }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="android-playstore-512.png" alt="Hook & Line" class="splash-logo" onerror="this.style.display='none'">
    <div class="splash-title">Hook <span>&</span> Line</div>
    <div class="splash-tagline">Songwriting & Lyric Studio</div>
  </div>

  <!-- Hidden File Input for PDF / TXT Import -->
  <input type="file" id="file-importer" accept=".txt,.pdf" style="display: none;" onchange="handleFileImport(event)">

  <!-- Sleek Studio Header -->
  <header>
    <div class="header-left">
      <div class="song-pill" onclick="openSongCatalog()">
        <span class="song-title-text" id="active-title">Untitled Song 1</span>
        <span class="version-tag" id="active-version-tag">v1</span>
      </div>
    </div>
    <div class="header-actions">
      <!-- AI Ghostwriter Button with dropdown -->
      <button class="icon-btn btn-ai" id="ai-ghostwriter-btn" onclick="toggleAiMenu(event)">✨ AI</button>
      <button class="icon-btn" id="record-btn" onclick="toggleAudioRecording()">🎙️ Rec</button>
      <button class="icon-btn" id="chord-visibility-btn" onclick="toggleChordVisibility()">Chords: On</button>
      <button class="icon-btn" onclick="exportSinglePDF()">PDF</button>
      <button class="icon-btn btn-accent" onclick="openSaveDialog()">Save</button>
    </div>
  </header>

  <!-- AI Ghostwriter Options Menu -->
  <div class="popover-menu" id="ai-popover">
    <div class="popover-item" onclick="triggerAiGhostwriter('finish_line')">Finish current line</div>
    <div class="popover-item" onclick="triggerAiGhostwriter('next_line')">Generate next line</div>
    <div class="popover-item" onclick="triggerAiGhostwriter('custom_lines')">Generate custom lines...</div>
    <div class="popover-item" style="color:var(--muted); font-size:11px;" onclick="promptApiKey()">⚙️ Set AI Key</div>

    function init() {

    // --- AI Ghostwriter Engine ---
    function toggleAiMenu(e) {
      e.stopPropagation();
      if (aiPopover.style.display === 'block') {
        aiPopover.style.display = 'none';
        return;
      }

      aiPopover.style.right = `${window.innerWidth - rect.right}px`;
      aiPopover.style.left = 'auto';
      aiPopover.style.display = 'block';
    }

    function promptApiKey() {
      aiPopover.style.display = 'none';
      const existing = localStorage.getItem('hookandline_gemini_key') || '';
      const key = prompt('Enter your Google Gemini API Key (saved locally in your browser):', existing);
      if (key !== null) {
        localStorage.setItem('hookandline_gemini_key', key.trim());
        showToast(key.trim() ? 'AI API key saved' : 'AI API key cleared');
      }
    }

    async function triggerAiGhostwriter(mode) {
      aiPopover.style.display = 'none';

      let apiKey = localStorage.getItem('hookandline_gemini_key');
      if (!apiKey) {
        apiKey = prompt('Please enter your Google Gemini API Key to use the lyric ghostwriter (stored locally in browser):');
        if (!apiKey || !apiKey.trim()) return;
        localStorage.setItem('hookandline_gemini_key', apiKey.trim());
      }

      let lineCount = 1;
      if (mode === 'custom_lines') {
        const countInput = prompt('How many lines would you like the AI to compose?', '2');
        if (!countInput) return;
        lineCount = parseInt(countInput, 10);
        if (isNaN(lineCount) || lineCount < 1) lineCount = 1;
      }

      // Capture full lyrics text and current context
      const clone = editor.cloneNode(true);
      clone.querySelectorAll('.chord-badge').forEach(b => b.remove());
      const entireLyrics = clone.innerText.trim();

      // Find text up to cursor position
      let prefixContext = entireLyrics;
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
        const preRange = document.createRange();
        preRange.selectNodeContents(editor);
        preRange.setEnd(sel.anchorNode, sel.anchorOffset);
        const tempDiv = document.createElement('div');
        tempDiv.appendChild(preRange.cloneContents());
        tempDiv.querySelectorAll('.chord-badge').forEach(b => b.remove());
        prefixContext = tempDiv.innerText.trim();
      }

      const song = state.songs.find(s => s.id === state.activeSongId);
      const songTitle = song ? song.title : 'Song';
      const langName = currentLanguage === 'no' ? 'Norwegian (Norsk)' : 'English';

      let taskPrompt = '';
      if (mode === 'finish_line') {
        taskPrompt = `The writer paused in the middle of a line. Finish the remainder of the current line naturally. Output ONLY the words that complete the line, no quotes, no explanation.`;
      } else if (mode === 'next_line') {
        taskPrompt = `Compose the single next line of lyrics that naturally follows the preceding lines in rhyme, meter, and tone. Output ONLY that single lyric line, without quotes, intros, or explanations.`;
      } else {
        taskPrompt = `Compose exactly ${lineCount} lines of lyrics that naturally follow in rhyme, cadence, and theme. Output ONLY the ${lineCount} lyric lines separated by line breaks, without any conversational preamble or quotes.`;
      }

      const systemPrompt = `You are a world-class songwriting collaborator and lyricist writing in ${langName}.
Song Title: "${songTitle}"

Full draft so far:
"""
${entireLyrics || "(Starting new song)"}
"""

Immediate lyrical context right before the cursor:
"""
${prefixContext || entireLyrics}
"""

Task: ${taskPrompt}`;

      showToast('AI is writing lines...');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: systemPrompt }] }],
            generationConfig: {
              temperature: 0.85,
              maxOutputTokens: 250
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'API request failed');
        }

        const data = await response.json();
        const output = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

        if (!output) throw new Error('No lyrics generated.');

        insertGeneratedLyrics(output, mode === 'finish_line');
        showToast('Inserted AI lyrics');
      } catch (err) {
        console.error(err);
        alert('AI Ghostwriter Error: ' + err.message);
      }
    }

    function insertGeneratedLyrics(text, appendInline) {
      editor.focus();
      let range = savedSelectionRange;
      const sel = window.getSelection();
      if (!range && sel && sel.rangeCount > 0) range = sel.getRangeAt(0);

      const lines = text.split('\n');

      if (appendInline) {
        const clean = (text.startsWith(' ') ? '' : ' ') + text;
        const textNode = document.createTextNode(clean);
        if (range && editor.contains(range.commonAncestorContainer)) {
          range.insertNode(textNode);
          range.setStartAfter(textNode);
          range.collapse(true);
        } else {
          editor.appendChild(textNode);
        }
      } else {
        const fragment = document.createDocumentFragment();
        lines.forEach(l => {
          const div = document.createElement('div');
          div.innerText = l.trim();
          fragment.appendChild(div);
        });

        if (range && editor.contains(range.commonAncestorContainer)) {
          range.deleteContents();
          range.insertNode(fragment);
        } else {
          editor.appendChild(fragment);
        }
      }

      updateMeter();
    }

    // --- File Import Engine (TXT & PDF) ---
    function triggerFilePicker() {
      fileImporter.value = '';
      fileImporter.click();
    }

    async function handleFileImport(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const fileNameWithoutExt = file.name.replace(/\.[^/.]+$/, '').trim();
      let extractedText = '';

      showToast('Reading file...');

      try {
        if (file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt')) {
          extractedText = await file.text();
        } else if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
          extractedText = await parsePdfText(file);
        } else {
          alert('Unsupported file format. Please upload a .txt or .pdf file.');
          return;
        }

        if (!extractedText || !extractedText.trim()) {
          alert('The selected document contains no readable text.');
          return;
        }

        processImportedLyrics(extractedText, fileNameWithoutExt);
      } catch (err) {
        console.error(err);
        alert('Failed to parse file: ' + err.message);
      }
    }

    async function parsePdfText(file) {
      if (!window.pdfjsLib) throw new Error('PDF reader engine not available.');
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        
        let lastY = null;
        let pageStr = '';

        for (const item of textContent.items) {
          if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
            pageStr += '\n';
          }
          pageStr += item.str;
          lastY = item.transform[5];
        }
        fullText += pageStr + '\n\n';
      }
      return fullText;
    }

    function processImportedLyrics(rawText, fallbackFileName) {
      const lines = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      
      let candidateTitle = '';
      let firstLineIndex = -1;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.length > 0) {
          firstLineIndex = i;
          break;
        }
      }

      if (firstLineIndex !== -1) {
        const firstLine = lines[firstLineIndex].trim();
        const isSectionTag = /^(verse|chorus|bridge|pre-chorus|intro|outro|hook)(\s+\d+)?$/i.test(firstLine);
        const isTooLong = firstLine.split(/\s+/).length > 8 || firstLine.length > 50;

        if (!isSectionTag && !isTooLong) {
          candidateTitle = firstLine;
          lines.splice(firstLineIndex, 1);
        }
      }

      const songTitle = candidateTitle || fallbackFileName || getNextUntitledSongTitle();

      let htmlOutput = '';
      lines.forEach(l => {
        const clean = l.trim();
        const sectionMatch = clean.match(/^(verse|chorus|bridge|pre-chorus|intro|outro)(\s+\d+)?$/i);

        if (sectionMatch) {
          htmlOutput += `<div class="section-header-tag" contenteditable="false" data-type="${sectionMatch[1].toLowerCase()}">${clean}</div><div><br></div>`;
        } else if (clean.length === 0) {
          htmlOutput += '<div><br></div>';
        } else {
          const escaped = clean.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          htmlOutput += `<div>${escaped}</div>`;
        }
      });

      const newSong = {
        id: 's_' + Date.now(),
        title: songTitle,
        versions: [{
          id: 'v_' + Date.now(),
          label: 'v1',
          html: htmlOutput,
          audioMemo: null,
          updatedAt: Date.now()
        }]
      };

      state.songs.unshift(newSong);
      saveState();
      loadSong(newSong.id, newSong.versions[0].id);
      closeSongCatalog();
      showToast(`Imported "${songTitle}"`);
    }

    // --- Song Renaming in Catalog ---
    function renameSong(songId, currentTitle, e) {
      if (e) e.stopPropagation();
      const newName = prompt('Rename song:', currentTitle);
      if (newName === null) return;

      const song = state.songs.find(s => s.id === songId);
      if (song) {
        song.title = cleanName;
        saveState();
        if (song.id === state.activeSongId) {
          document.getElementById('active-title').innerText = cleanName;
          document.title = cleanName + ' — Hook & Line';
        }
        renderCatalogList();
        showToast(`Renamed to "${cleanName}"`);
      }
    }

    // Language Toggle logic & UI adaptation
    function setLanguage(lang, triggerSearch = true) {
      currentLanguage = lang;
      localStorage.setItem('hookandline_lang', lang);

      langEnBtn.classList.toggle('active', lang === 'en');
      langNoBtn.classList.toggle('active', lang === 'no');

      const unsupportedCats = ['cat-phrases', 'cat-idioms', 'cat-alliterations', 'cat-trg'];
      if (lang === 'no') {
        unsupportedCats.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.classList.add('disabled');
        });

        if (['phrases', 'idioms', 'alliterations', 'rel_trg'].includes(activeFilterMode)) {
          switchTab('rel_rhy');
        }
        queryField.placeholder = "Søk rim og synonymer...";
      } else {
        unsupportedCats.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.classList.remove('disabled');
        });
        queryField.placeholder = "Search reference term...";
      }

      if (triggerSearch) {
        const term = queryField.value.trim() || selectedWord;
        if (term) executeLookup(term);
      }
    }

    function switchTab(mode) {
      document.querySelectorAll('.category-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
      activeFilterMode = mode;
      alliterationStrip.classList.toggle('visible', mode === 'alliterations');
    }

    // Audio Voice Memo & Speech-to-Text Transcription
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
          let current = '';
          for (let i = e.resultIndex; i < e.results.length; ++i) {
            current += e.results[i][0].transcript;
          }
          transcribedText = current.trim();
        };
        recognition.onerror = () => {};
      }
    }

    async function toggleAudioRecording() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          transcribedText = '';

          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = handleRecordingComplete;

          mediaRecorder.start();
          if (recognition) {
            recognition.lang = currentLanguage === 'no' ? 'nb-NO' : 'en-US';
            try { recognition.start(); } catch (err) {}
          }

          isRecording = true;
          recordBtn.innerText = '⏹ Stop';
          recordBtn.classList.add('btn-recording');
          showToast(currentLanguage === 'no' ? 'Tar opp og transkriberer...' : 'Recording & transcribing...');
        } catch (err) {
          alert('Microphone access denied or not supported on this browser.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        if (recognition) try { recognition.stop(); } catch (err) {}
        isRecording = false;
        recordBtn.innerText = '🎙️ Rec';
        recordBtn.classList.remove('btn-recording');
      }
    }

    function handleRecordingComplete() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64Audio = reader.result;
        const song = state.songs.find(s => s.id === state.activeSongId);
        if (song) {
          const ver = song.versions.find(v => v.id === state.activeVersionId);
          if (ver) {
            ver.audioMemo = base64Audio;
            saveState();
            displayAudioMemo(base64Audio);
          }
        }

        if (transcribedText) {
          const textDiv = document.createElement('div');
          textDiv.innerText = transcribedText;
          editor.appendChild(textDiv);
          updateMeter();
          showToast(`Transcribed: "${transcribedText.slice(0, 18)}..."`);
        } else {
          showToast('Audio saved to song');
        }
      };
      reader.readAsDataURL(audioBlob);
    }

    function displayAudioMemo(audioSrc) {
      if (audioSrc) {
        memoAudio.src = audioSrc;
        memoBar.classList.add('visible');
      } else {
        memoAudio.src = '';
        memoBar.classList.remove('visible');
      }
    }

    function deleteAudioMemo() {
      if (!confirm('Delete this voice recording?')) return;
      const song = state.songs.find(s => s.id === state.activeSongId);
      if (song) {
        const ver = song.versions.find(v => v.id === state.activeVersionId);
        if (ver) {

    }

    function initResizableDrawer() {
      let isDragging = false;
      let startY = 0;
      let startHeight = 0;

      const startDrag = (clientY) => {
        isDragging = true;
        startY = clientY;
        startHeight = referenceSuite.getBoundingClientRect().height;
        document.body.style.cursor = 'row-resize';
      };

      const doDrag = (clientY) => {
        if (!isDragging) return;
        const delta = startY - clientY;
        const newHeight = startHeight + delta;
        const workspaceHeight = workspace.getBoundingClientRect().height;

        const minHeight = workspaceHeight * 0.15;
        const maxHeight = workspaceHeight * 0.75;

        if (newHeight >= minHeight && newHeight <= maxHeight) {
          const heightPx = `${newHeight}px`;
          referenceSuite.style.height = heightPx;
          localStorage.setItem('hookandline_drawer_height', heightPx);
        }
      };

      const stopDrag = () => {
        if (isDragging) {
          isDragging = false;
          document.body.style.cursor = '';
        }
      };

      resizeHandle.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientY), { passive: true });
      window.addEventListener('touchmove', (e) => { if (isDragging) doDrag(e.touches[0].clientY); }, { passive: false });
      window.addEventListener('touchend', stopDrag);
      window.addEventListener('touchcancel', stopDrag);

      resizeHandle.addEventListener('mousedown', (e) => { e.preventDefault(); startDrag(e.clientY); });
      window.addEventListener('mousemove', (e) => { if (isDragging) doDrag(e.clientY); });
      window.addEventListener('mouseup', stopDrag);
    }

      const isCollapsed = chordContainer.classList.toggle('collapsed');
      chordCollapseBtn.innerText = isCollapsed ? 'Show ▼' : 'Hide ▲';
      localStorage.setItem('hookandline_chords_collapsed', isCollapsed ? 'true' : 'false');

    function showToast(text) {

    function sanitizeEditorHTML(rawHtml) {

    function loadSong(songId, verId) {
      if (!state.songs.length) {
        createNewSong(false);

      }

      let song = state.songs.find(s => s.id === songId);
      if (!song) {

      }
      state.activeSongId = songId;

      const ver = song.versions.find(v => v.id === verId) || song.versions[song.versions.length - 1];
      state.activeVersionId = ver.id;

      document.getElementById('active-title').innerText = song.title;

    function bindChordListeners() {
      editor.querySelectorAll('.chord-badge').forEach(badge => {
        badge.onclick = (e) => {
          e.stopPropagation();
          if (selectedChordElem === badge) {
            badge.classList.remove('selected');
            selectedChordElem = null;
          } else {
            if (selectedChordElem) selectedChordElem.classList.remove('selected');
            badge.classList.add('selected');

      });

    function bindSectionTagListeners() {
      editor.querySelectorAll('.section-header-tag').forEach(tag => {
        tag.onclick = (e) => {
          e.stopPropagation();
          const action = prompt(`Edit section name or type "delete" to remove:`, tag.innerText);
          if (action === null) return;
          if (action.toLowerCase().trim() === 'delete' || action.trim() === '') {
            tag.remove();
          } else {
            tag.innerText = action.trim();

          renumberVerses();
          updateMeter();

    function renumberVerses() {
      let verseCount = 1;
      editor.querySelectorAll('.section-header-tag').forEach(tag => {
        if (tag.dataset.type === 'verse' || /^verse(\s+\d+)?$/i.test(tag.innerText.trim())) {
          tag.dataset.type = 'verse';
          tag.innerText = `Verse ${verseCount++}`;

      });

    function saveCurrentRange() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) savedSelectionRange = sel.getRangeAt(0);
    }

    let selectionTimeout = null;
    document.addEventListener('selectionchange', () => {
      clearTimeout(selectionTimeout);
      selectionTimeout = setTimeout(() => {
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;

        const anchor = sel.anchorNode;
        if (!anchor || !editor.contains(anchor)) {
          floatActions.style.display = 'none';
          return;
        }

        saveCurrentRange();

        const markedText = sel.toString().trim();
        if (markedText.length > 0) {
          const cleanTerm = markedText.replace(/[^a-zA-ZæøåÆØÅ\s]/g, '').trim();
          if (cleanTerm.length > 1) {
            selectedWord = cleanTerm;
            findRhymesBtn.innerText = `Rhymes: "${selectedWord.slice(0, 10)}${selectedWord.length > 10 ? '...' : ''}"`;
            executeLookup(selectedWord);
          }
          floatActions.style.display = 'flex';
          return;
        }
        floatActions.style.display = 'none';
      }, 150);
    });

    editor.addEventListener('input', () => { 
      renumberVerses();
      updateMeter(); 
    });

    function openTagModal() { document.getElementById('tag-modal').classList.add('active'); }
    function closeTagModal() { document.getElementById('tag-modal').classList.remove('active'); }

    function applySectionTag(type, customLabel) {
      closeTagModal();
      floatActions.style.display = 'none';

      let range = savedSelectionRange;
      if (!range) {
        const sel = window.getSelection();
        if (sel.rangeCount > 0) range = sel.getRangeAt(0);
      }

      const tag = document.createElement('div');
      tag.className = 'section-header-tag';
      tag.contentEditable = 'false';
      tag.dataset.type = type;

      if (type === 'verse') tag.innerText = 'Verse';
      else if (type === 'pre-chorus') tag.innerText = 'Pre-Chorus';
      else if (type === 'chorus') tag.innerText = 'Chorus';
      else if (type === 'bridge') tag.innerText = 'Bridge';
      else tag.innerText = customLabel || 'Section';

      const nextRow = document.createElement('div');
      nextRow.innerHTML = '<br>';

      if (range) {
        let container = range.startContainer;
        if (container.nodeType === 3) container = container.parentNode;
        while (container && container.parentNode !== editor && container !== editor) {
          container = container.parentNode;
        }

        if (container && container !== editor) {
          editor.insertBefore(tag, container);
          editor.insertBefore(nextRow, container);
        } else {
          range.insertNode(nextRow);
          range.insertNode(tag);
        }
      } else {
        editor.prepend(nextRow);
        editor.prepend(tag);
      }

      const newRange = document.createRange();
      newRange.setStart(nextRow, 0);
      newRange.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(newRange);
      savedSelectionRange = newRange;

      bindSectionTagListeners();
      renumberVerses();
      updateMeter();
      showToast(`Added ${tag.innerText}`);
    }

    function promptCustomTag() {
      const custom = prompt('Enter custom section name (e.g. Outro, Solo, Intro):');
      if (custom && custom.trim()) applySectionTag('custom', custom.trim());
    }

    function countSyllables(word) {
      word = word.toLowerCase().replace(/[^a-zæøå]/g, '');
      if (!word) return 0;
      if (word.length <= 3) return 1;
      word = word.replace(/(?:[^laeiouyæøå]es|ed|[^laeiouyæøå]e)$/, '');
      word = word.replace(/^y/, '');
      const m = word.match(/[aeiouyæøå]{1,2}/g);
      return m ? m.length : 1;
    }

    function updateMeter() {
      const clone = editor.cloneNode(true);
      clone.querySelectorAll('.chord-badge').forEach(b => b.remove());

      let itemsHtml = '';
      let totalWords = 0;
      let totalLines = 0;

      Array.from(clone.childNodes).forEach(node => {
        if (node.classList && node.classList.contains('section-header-tag')) {
          itemsHtml += '<div class="meter-item section-spacer">·</div>';
          return;
        }

        const text = (node.innerText !== undefined ? node.innerText : node.textContent) || '';
        const lines = text.split('\n');

        lines.forEach((lineText, idx) => {
          if (idx > 0 && lineText === '' && lines.length === 2) return;
          const clean = lineText.trim();
          if (!clean) {
            itemsHtml += '<div class="meter-item">·</div>';
          } else {
            totalLines++;
            const words = clean.split(/\s+/).filter(w => w.length > 0);
            totalWords += words.length;
            const count = words.reduce((sum, w) => sum + countSyllables(w), 0);
            itemsHtml += `<div class="meter-item">${count}</div>`;
          }
        });
      });

      meterRail.innerHTML = itemsHtml || '<div class="meter-item">·</div>';
      editorStats.innerText = `Words: ${totalWords} · Lines: ${totalLines}`;
    }

    function insertChordAtCursor(chord) {
      if (selectedChordElem) {
        selectedChordElem.dataset.chord = chord;
        selectedChordElem.querySelector('.chord-badge-inner').innerText = chord;
        selectedChordElem.classList.remove('selected');
        selectedChordElem = null;
        showToast(`Swapped chord to ${chord}`);
        updateMeter();
        return;
      }

      editor.focus();
      let range = savedSelectionRange;
      if (!range) {
        const sel = window.getSelection();
        if (sel.rangeCount > 0) range = sel.getRangeAt(0);
      }

      const badge = document.createElement('span');
      badge.className = 'chord-badge';
      badge.contentEditable = 'false';
      badge.dataset.chord = chord;
      badge.innerHTML = `<span class="chord-badge-inner">${chord}</span>`;

      if (range && editor.contains(range.commonAncestorContainer)) {
        range.deleteContents();
        range.insertNode(badge);
        range.setStartAfter(badge);
        range.setEndAfter(badge);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        savedSelectionRange = range;
      } else {
        editor.appendChild(badge);
      }

      bindChordListeners();
      showToast(`Placed ${chord}`);
      updateMeter();
    }

    // Reference Engine (Dual Norwegian / English Support)
    async function executeLookup(term) {
      if (!term) return;
      queryField.value = term;
      dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">${currentLanguage === 'no' ? 'Søker referanser for' : 'Searching studio reference for'} "${term}"...</span>`;

      try {
        if (currentLanguage === 'no') {
          let url = '';
          if (activeFilterMode === 'rel_rhy') {
            url = `https://rimregisteret.no/api/v1/rim/${encodeURIComponent(term)}`;
          } else if (activeFilterMode === 'rel_nry') {
            url = `https://rimregisteret.no/api/v1/halvrim/${encodeURIComponent(term)}`;
          } else if (activeFilterMode === 'rel_syn') {
            url = `https://rimregisteret.no/api/v1/synonymer/${encodeURIComponent(term)}`;
          }

          let results = [];
          try {
            const res = await fetch(url);
            if (res.ok) {
              const data = await res.json();
              results = Array.isArray(data) ? data : (data.results || data.ord || []);
            }
          } catch (netErr) {
            const fallbackRes = await fetch(`https://no.wiktionary.org/w/api.php?action=opensearch&search=${encodeURIComponent(term)}&limit=30&origin=*`);
            const fallbackData = await fallbackRes.json();
            if (fallbackData && fallbackData[1]) {
              results = fallbackData[1].map(w => ({ ord: w, stavelser: countSyllables(w) }));
            }
          }

          dictFeed.innerHTML = '';
          if (!results.length) {
            dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">Ingen treff for "${term}".</span>`;
            return;
          }

          const groups = { '1 Stavelse': [], '2 Stavelser': [], '3+ Stavelser': [] };
          results.forEach(item => {
            const word = typeof item === 'string' ? item : (item.ord || item.word);
            const syl = (typeof item === 'object' && item.stavelser) ? item.stavelser : countSyllables(word);
            if (syl === 1) groups['1 Stavelse'].push({ word, syl });
            else if (syl === 2) groups['2 Stavelser'].push({ word, syl });
            else groups['3+ Stavelser'].push({ word, syl });
          });

          for (const [title, list] of Object.entries(groups)) {
            if (!list.length) continue;
            const section = document.createElement('div');
            section.innerHTML = `<div class="syllable-group-title">${title} (${list.length})</div>`;
            const cluster = document.createElement('div');
            cluster.className = 'chips-cluster';

            list.forEach(item => {
              const card = document.createElement('div');
              card.className = 'word-card';
              card.innerHTML = `${item.word} <span>${item.syl}</span> <span class="collect-btn" onclick="collectWord('${item.word.replace(/'/g, "\\'")}', event)">⭐</span>`;
              card.onclick = () => {
                navigator.clipboard.writeText(item.word);
                showToast(`Kopierte "${item.word}"`);
              };
              cluster.appendChild(card);
            });
            section.appendChild(cluster);
            dictFeed.appendChild(section);
          }
          return;
        }

        // --- ENGLISH MODE (Datamuse API) ---
        if (activeFilterMode === 'phrases') {
          const [resBefore, resAfter] = await Promise.all([
            fetch(`https://api.datamuse.com/words?rel_bga=${encodeURIComponent(term)}&md=f&max=40`),
            fetch(`https://api.datamuse.com/words?rel_bgb=${encodeURIComponent(term)}&md=f&max=40`)
          ]);
          const beforeData = await resBefore.json();
          const afterData = await resAfter.json();

          dictFeed.innerHTML = '';
          const phrases = [];
          beforeData.forEach(w => phrases.push(`${term} ${w.word}`));
          afterData.forEach(w => phrases.push(`${w.word} ${term}`));

          if (!phrases.length) {
            dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">No phrase pairings found for "${term}".</span>`;
            return;
          }

          const section = document.createElement('div');
          section.innerHTML = `<div class="syllable-group-title">Word Pairings (${phrases.length})</div>`;
          phrases.forEach(phrase => {
            const card = document.createElement('div');
            card.className = 'phrase-card';
            card.innerHTML = `<span>${phrase}</span> <span style="font-size:13px;" onclick="collectWord('${phrase.replace(/'/g, "\\'")}', event)">⭐</span>`;
            card.onclick = () => {
              navigator.clipboard.writeText(phrase);
              showToast(`Copied "${phrase}"`);
            };
            section.appendChild(card);
          });
          dictFeed.appendChild(section);
          return;
        }

        if (activeFilterMode === 'idioms') {
          const [res1, res2] = await Promise.all([
            fetch(`https://api.datamuse.com/words?sp=*+${encodeURIComponent(term)}+*&max=60`),
            fetch(`https://api.datamuse.com/words?sp=*+${encodeURIComponent(term)}&max=40`)
          ]);
          const data1 = await res1.json();
          const data2 = await res2.json();

          const idiomMap = new Map();
          [...data1, ...data2].forEach(item => {
            if (item.word.includes(' ') && !idiomMap.has(item.word)) idiomMap.set(item.word, item);
          });

          dictFeed.innerHTML = '';
          const list = Array.from(idiomMap.values());
          if (!list.length) {
            dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">No idioms found containing "${term}".</span>`;
            return;
          }

          const section = document.createElement('div');
          section.innerHTML = `<div class="syllable-group-title">Idioms & Sayings (${list.length})</div>`;
          list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'phrase-card';
            card.innerHTML = `<span>${item.word}</span> <span style="font-size:13px;" onclick="collectWord('${item.word.replace(/'/g, "\\'")}', event)">⭐</span>`;
            card.onclick = () => {
              navigator.clipboard.writeText(item.word);
              showToast(`Copied "${item.word}"`);
            };
            section.appendChild(card);
          });
          dictFeed.appendChild(section);
          return;
        }

        if (activeFilterMode === 'alliterations') {
          const letter = (selectedLetter || 'A').toLowerCase();
          const res = await fetch(`https://api.datamuse.com/words?sp=${letter}*&ml=${encodeURIComponent(term)}&md=f&max=80`);
          const words = await res.json();
          dictFeed.innerHTML = '';

          if (!words.length) {
            dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">No alliterations starting with "${selectedLetter.toUpperCase()}".</span>`;
            return;
          }

          const section = document.createElement('div');
          section.innerHTML = `<div class="syllable-group-title">Alliterations with "${selectedLetter.toUpperCase()}" (${words.length})</div>`;
          const cluster = document.createElement('div');
          cluster.className = 'chips-cluster';

          words.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `${item.word} <span class="collect-btn" onclick="collectWord('${item.word.replace(/'/g, "\\'")}', event)">⭐</span>`;
            card.onclick = () => {
              navigator.clipboard.writeText(item.word);
              showToast(`Copied "${item.word}"`);
            };
            cluster.appendChild(card);
          });
          section.appendChild(cluster);
          dictFeed.appendChild(section);
          return;
        }

        // Rhymes, Near Rhymes, Synonyms, Word Families
        const res = await fetch(`https://api.datamuse.com/words?${activeFilterMode}=${encodeURIComponent(term)}&md=f&max=100`);
        const words = await res.json();
        dictFeed.innerHTML = '';

        if (!words || !words.length) {
          dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">No matches found for "${term}".</span>`;
          return;
        }

        const groups = { '1 Syllable': [], '2 Syllables': [], '3+ Syllables': [] };
        words.forEach(w => {
          const syl = w.numSyllables || countSyllables(w.word);
          if (syl === 1) groups['1 Syllable'].push(w);
          else if (syl === 2) groups['2 Syllables'].push(w);
          else groups['3+ Syllables'].push(w);
        });

        for (const [title, list] of Object.entries(groups)) {
          if (!list.length) continue;
          const section = document.createElement('div');
          section.innerHTML = `<div class="syllable-group-title">${title} (${list.length})</div>`;
          const cluster = document.createElement('div');
          cluster.className = 'chips-cluster';

          list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `${item.word} <span>${item.numSyllables || ''}</span> <span class="collect-btn" onclick="collectWord('${item.word.replace(/'/g, "\\'")}', event)">⭐</span>`;
            card.onclick = () => {
              navigator.clipboard.writeText(item.word);
              showToast(`Copied "${item.word}"`);
            };
            cluster.appendChild(card);
          });
          section.appendChild(cluster);
          dictFeed.appendChild(section);
        }
      } catch (e) {
        dictFeed.innerHTML = '<span style="color:var(--accent); font-size:12px;">Network error. Check connection.</span>';
      }
    }

    function openSaveDialog() { document.getElementById('save-overlay').classList.add('active'); }
    function closeSaveDialog() { document.getElementById('save-overlay').classList.remove('active'); }

    function commitSave(type) {
      const song = state.songs.find(s => s.id === state.activeSongId);
      if (!song) return;

      if (type === 'overwrite') {
        const ver = song.versions.find(v => v.id === state.activeVersionId);
        if (ver) {
          ver.html = editor.innerHTML;
          ver.updatedAt = Date.now();
          showToast(`Saved (${ver.label})`);
        }
      } else if (type === 'new-version') {
        const vNum = song.versions.length + 1;
        const newV = {
          id: 'v_' + Date.now(),
          label: 'v' + vNum,
          html: editor.innerHTML,
          audioMemo: null,
          updatedAt: Date.now()
        };
        song.versions.push(newV);
        state.activeVersionId = newV.id;
        document.getElementById('active-version-tag').innerText = newV.label;
        showToast(`Saved new version (v${vNum})`);
      }
      saveState();
      closeSaveDialog();
    }

    function getNextUntitledSongTitle() {
      let maxNum = 0;
      const regex = /^Untitled Song(?:\s+(\d+))?$/i;
      state.songs.forEach(s => {
        const match = s.title.trim().match(regex);
        if (match) {
          const num = match[1] ? parseInt(match[1], 10) : 1;
          if (num > maxNum) maxNum = num;
        }
      });
      return `Untitled Song ${maxNum + 1}`;
    }

    function createNewSong(promptUser = true) {
      let name = '';
      if (promptUser) {
        const input = prompt('Song title (leave blank for Untitled Song):');
        if (input === null) return;
        name = input.trim();
      }
      if (!name) name = getNextUntitledSongTitle();

      const newSong = {
        id: 's_' + Date.now(),
        title: name,
        versions: [{ id: 'v_' + Date.now(), label: 'v1', html: '', audioMemo: null, updatedAt: Date.now() }]
      };
      state.songs.unshift(newSong);
      loadSong(newSong.id, newSong.versions[0].id);
      closeSongCatalog();
      showToast(`Created "${newSong.title}"`);
    }

    function deleteSong(songId, songTitle, e) {
      if (e) e.stopPropagation();
      if (!confirm(`Delete "${songTitle}"? This cannot be undone.`)) return;

      const idx = state.songs.findIndex(s => s.id === songId);
      if (idx !== -1) {
        state.songs.splice(idx, 1);
        selectedSongIds.delete(songId);
        showToast(`Deleted "${songTitle}"`);
        saveState();

        if (songId === state.activeSongId) {
          if (state.songs.length > 0) loadSong(state.songs[0].id, state.songs[0].versions[0].id);
          else createNewSong(false);
        }
        renderCatalogList();
      }
    }

    function deleteSelectedSongs() {
      if (selectedSongIds.size === 0) return;
      if (!confirm(`Delete all ${selectedSongIds.size} selected songs?`)) return;

      state.songs = state.songs.filter(s => !selectedSongIds.has(s.id));
      showToast(`Deleted ${selectedSongIds.size} songs`);
      selectedSongIds.clear();
      saveState();

      if (!state.songs.some(s => s.id === state.activeSongId)) {
        if (state.songs.length > 0) loadSong(state.songs[0].id, state.songs[0].versions[0].id);
        else createNewSong(false);
      }
      renderCatalogList();
    }

    function exportSinglePDF() {
      const song = state.songs.find(s => s.id === state.activeSongId);
      const originalTitle = document.title;
      document.title = song ? song.title : 'Song';

      const printContainer = document.getElementById('all-songs-print-container');
      printContainer.innerHTML = `
        <div class="song-print-block">
          <div class="song-print-title">${song.title}</div>
          <div style="font-size:16px; line-height:36px;">${editor.innerHTML}</div>
        </div>
      `;
      window.print();
      setTimeout(() => { document.title = originalTitle; }, 1000);
    }

    function exportSelectedPDF() {
      if (selectedSongIds.size === 0) {
        alert('Please mark at least one song to export.');
        return;
      }
      closeSongCatalog();
      const originalTitle = document.title;
      document.title = selectedSongIds.size === 1 
        ? (state.songs.find(s => selectedSongIds.has(s.id))?.title || 'Song')
        : 'Hook_and_Line_Selection';

      const targetSongs = state.songs.filter(s => selectedSongIds.has(s.id));
      const printContainer = document.getElementById('all-songs-print-container');

      printContainer.innerHTML = targetSongs.map(song => {
        const latestVer = song.versions[song.versions.length - 1];
        return `
          <div class="song-print-block">
            <div class="song-print-title">${song.title} <span style="font-size:12px; font-weight:normal; color:#666;">(${latestVer.label})</span></div>
            <div style="font-size:16px; line-height:36px;">${latestVer.html}</div>
          </div>
        `;
      }).join('');
      window.print();
      setTimeout(() => { document.title = originalTitle; }, 1000);
    }

    function updateSelectedCounter() {
      const exportBtn = document.getElementById('export-selected-btn');
      const deleteBtn = document.getElementById('delete-selected-btn');
      exportBtn.innerText = `Export Selected (${selectedSongIds.size})`;
      deleteBtn.innerText = `Delete (${selectedSongIds.size})`;
      deleteBtn.style.display = selectedSongIds.size > 0 ? 'inline-flex' : 'none';
    }

    function toggleSelectAll() {
      if (selectedSongIds.size === state.songs.length) {
        selectedSongIds.clear();
      } else {
        selectedSongIds = new Set(state.songs.map(s => s.id));
      }
      renderCatalogList();
      updateSelectedCounter();
    }

    function renderCatalogList() {
      const list = document.getElementById('catalog-list');
      list.innerHTML = '';

      if (state.songs.length === 0) {
        list.innerHTML = '<div style="color:var(--muted); text-align:center; padding:20px;">No songs yet. Tap "+ New" or "Import".</div>';
        updateSelectedCounter();
        return;
      }

      state.songs.forEach(song => {
        const item = document.createElement('div');
        item.className = `song-row ${song.id === state.activeSongId ? 'active' : ''}`;
        const isChecked = selectedSongIds.has(song.id);

        item.innerHTML = `
          <input type="checkbox" class="song-checkbox" ${isChecked ? 'checked' : ''}>
          <div class="song-info">
            <div class="song-name">${song.title}</div>
            <div style="font-size:11px; color:var(--muted);">${song.versions.length} versions (Hold for version menu)</div>
          </div>
          <button class="btn-edit-song" title="Rename Song">✏️</button>
          <button class="btn-delete-song" title="Delete Song">🗑️</button>
        `;

        const checkbox = item.querySelector('.song-checkbox');
        checkbox.onclick = (e) => {
          e.stopPropagation();
          if (checkbox.checked) selectedSongIds.add(song.id);
          else selectedSongIds.delete(song.id);
          updateSelectedCounter();
        };

        const editBtn = item.querySelector('.btn-edit-song');
        editBtn.onclick = (e) => renameSong(song.id, song.title, e);

        const deleteBtn = item.querySelector('.btn-delete-song');
        deleteBtn.onclick = (e) => deleteSong(song.id, song.title, e);

        let timer;
        const startPress = e => timer = setTimeout(() => showVersionPopover(song, e), 500);
        const cancelPress = () => clearTimeout(timer);

        item.addEventListener('touchstart', startPress, { passive: true });
        item.addEventListener('touchend', cancelPress);
        item.addEventListener('touchmove', cancelPress);
        item.addEventListener('mousedown', startPress);
        item.addEventListener('mouseup', cancelPress);

        item.onclick = (e) => {
          if (e.target !== checkbox && e.target !== deleteBtn && e.target !== editBtn) {
            loadSong(song.id, song.versions[song.versions.length - 1].id);
            closeSongCatalog();
          }
        };

        list.appendChild(item);
      });
      updateSelectedCounter();
    }

    function openSongCatalog() {
      renderCatalogList();
      document.getElementById('catalog-overlay').classList.add('active');
    }

    function closeSongCatalog() {
      document.getElementById('catalog-overlay').classList.remove('active');
      versionPopover.style.display = 'none';
    }

    function showVersionPopover(song, evt) {
      const touch = evt.touches ? evt.touches[0] : evt;
      versionPopover.innerHTML = `<div style="padding:8px 12px; font-size:11px; color:var(--muted);">${song.title} Versions</div>`;
      song.versions.forEach(v => {
        const row = document.createElement('div');
        row.className = 'popover-item';
        row.innerHTML = `<strong>${v.label}</strong> <span style="font-size:11px; color:var(--muted); margin-left:8px;">${new Date(v.updatedAt).toLocaleDateString()}</span>`;
        row.onclick = e => {
          e.stopPropagation();
          loadSong(song.id, v.id);
          closeSongCatalog();
        };
        versionPopover.appendChild(row);
      });
      versionPopover.style.left = `${Math.min(touch.clientX, window.innerWidth - 180)}px`;
      versionPopover.style.top = `${Math.min(touch.clientY, window.innerHeight - 200)}px`;
      versionPopover.style.display = 'block';
    }

    window.addEventListener('click', e => {
      if (!versionPopover.contains(e.target)) versionPopover.style.display = 'none';
      if (!aiPopover.contains(e.target) && e.target !== aiBtn) aiPopover.style.display = 'none';
    });

    init();
  </script>
</body>
</html>
