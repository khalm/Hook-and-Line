<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr. Writer</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1c1c20;
      --border: #2c2c34;
      --accent: #e5484d;
      --accent-hover: #f05a5f;
      --text: #f3f3f6;
      --muted: #8e8e9c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }

    /* Top Bar */
    header {
      padding: 10px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .icon-btn {
      background: #25252b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .song-title-display {
      font-weight: 600;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .version-tag {
      font-size: 11px;
      background: #2e2e38;
      color: var(--muted);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
    }
    .btn-save { background: var(--accent); border: none; color: #fff; font-weight: 600; }

    /* Main Workspace */
    .editor-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      padding: 12px 10px;
      background: var(--bg);
    }
    .syllable-col {
      width: 24px;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      line-height: 24px;
      padding-right: 6px;
      border-right: 1px solid #222;
    }
    #lyrics-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      line-height: 24px;
      resize: none;
      padding-left: 10px;
      user-select: text;
      white-space: pre-wrap;
    }

    /* Floating Selection Popup */
    #selection-rhyme-btn {
      position: absolute;
      display: none;
      z-index: 50;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 18px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      cursor: pointer;
      transform: translate(-50%, -100%);
    }

    /* Bottom Rhymes Tray */
    .rhyme-drawer {
      height: 38%;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .drawer-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .drawer-chips {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
    }
    .chip {
      background: #25252b;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .chip span { color: var(--muted); font-size: 10px; margin-left: 4px; }
    .chip:active { background: var(--accent); }

    /* Songs Sidebar / Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-window {
      background: var(--card);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      border: 1px solid var(--border);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body { flex: 1; overflow-y: auto; padding: 8px; }

    .song-item {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      margin-bottom: 6px;
      background: #18181c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .song-item.active { border-color: var(--accent); }
    .song-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* Dropdown for versions */
    .version-popup {
      position: fixed;
      background: #25252c;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: none;
      z-index: 200;
      min-width: 160px;
      overflow: hidden;
    }
    .version-item {
      padding: 10px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .version-item:hover, .version-item:active { background: #32323a; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,20,22,0.95);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #fff;
      display: none;
      z-index: 300;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="icon-btn" onclick="openSongsList()">Songs</button>
      <span class="song-title-display" id="current-title">Untitled</span>
      <span class="version-tag" id="current-version">v1</span>
    </div>
    <button class="icon-btn" onclick="newSongPrompt()">+ New</button>
    <button class="icon-btn btn-save" onclick="promptSave()">Save</button>
  </header>

  <div class="editor-container" id="editor-wrap">
    <div class="syllable-col" id="syllables">1</div>
    <textarea id="lyrics-input" placeholder="Start typing lyrics... Double-tap or select a word to rhyme."></textarea>
    <button id="selection-rhyme-btn">Rhymes</button>
  </div>

  <div class="rhyme-drawer">
    <div class="drawer-header">
      <span id="rhyme-target">Target: None</span>
      <span style="color:var(--muted); font-size:11px;">Tap chip to copy to clipboard</span>
    </div>
    <div class="drawer-chips" id="rhyme-results">
      <span style="color:var(--muted); font-size:12px;">Select a word in your lyrics to search.</span>
    </div>
  </div>

  <!-- Songs Modal -->
  <div class="modal-overlay" id="songs-modal">
    <div class="modal-window">
      <div class="modal-head">
        <strong>Your Songs</strong>
        <button class="icon-btn" onclick="closeSongsList()">Close</button>
      </div>
      <div class="modal-body" id="song-list-content"></div>
    </div>
  </div>

  <!-- Long Press Version Dropdown -->
  <div class="version-popup" id="version-menu"></div>

  <!-- Save Options Action Sheet -->
  <div class="modal-overlay" id="save-modal">
    <div class="modal-window">
      <div class="modal-head">
        <strong>Save Options</strong>
        <button class="icon-btn" onclick="closeSaveModal()">Cancel</button>
      </div>
      <div class="modal-body" style="display:flex; flex-direction:column; gap:8px; padding:16px;">
        <button class="icon-btn" style="padding:12px;" onclick="executeSave('overwrite')">Overwrite Current Version</button>
        <button class="icon-btn btn-save" style="padding:12px;" onclick="executeSave('new-version')">Save as New Version</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // State Schema
    let state = {
      activeSongId: null,
      activeVersionId: null,
      songs: []
    };

    const textarea = document.getElementById('lyrics-input');
    const syllables = document.getElementById('syllables');
    const floatBtn = document.getElementById('selection-rhyme-btn');
    const rhymeTarget = document.getElementById('rhyme-target');
    const rhymeResults = document.getElementById('rhyme-results');
    const versionMenu = document.getElementById('version-menu');
    let selectedWord = '';

    // Init Database from localStorage
    function loadState() {
      const data = localStorage.getItem('mrwriter_db');
      if (data) {
        state = JSON.parse(data);
      } else {
        const initialSong = {
          id: 'song_' + Date.now(),
          title: 'My First Song',
          versions: [{ id: 'v_1', label: 'v1', content: 'Type your lyrics here...', timestamp: Date.now() }]
        };
        state.songs = [initialSong];
        state.activeSongId = initialSong.id;
        state.activeVersionId = 'v_1';
        persist();
      }
      mountSong(state.activeSongId, state.activeVersionId);
    }

    function persist() {
      localStorage.setItem('mrwriter_db', JSON.stringify(state));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    // Mount active song & version
    function mountSong(songId, verId) {
      const song = state.songs.find(s => s.id === songId);
      if (!song) return;
      state.activeSongId = songId;
      const version = song.versions.find(v => v.id === verId) || song.versions[song.versions.length - 1];
      state.activeVersionId = version.id;

      document.getElementById('current-title').innerText = song.title;
      document.getElementById('current-version').innerText = version.label;
      textarea.value = version.content;
      updateSyllables();
      persist();
    }

    // Syllable Counter
    function countWordSyllables(w) {
      w = w.toLowerCase().replace(/[^a-z]/g, '');
      if (!w) return 0;
      if (w.length <= 3) return 1;
      w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
      w = w.replace(/^y/, '');
      const match = w.match(/[aeiouy]{1,2}/g);
      return match ? match.length : 1;
    }

    function updateSyllables() {
      const lines = textarea.value.split('\n');
      syllables.innerHTML = lines.map(line => {
        if (!line.trim()) return '&nbsp;';
        const words = line.trim().split(/\s+/);
        return words.reduce((acc, word) => acc + countWordSyllables(word), 0);
      }).join('<br>');
    }

    textarea.addEventListener('input', updateSyllables);

    // Text Selection & Floating Rhyme Button
    function evaluateSelection() {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      if (start !== end) {
        const text = textarea.value.substring(start, end).trim();
        if (text && !/\s/.test(text)) {
          selectedWord = text.replace(/[^a-zA-Z]/g, '');
          if (selectedWord) {
            floatBtn.style.top = '20px';
            floatBtn.style.left = '50%';
            floatBtn.style.display = 'block';
            return;
          }
        }
      }
      floatBtn.style.display = 'none';
    }

    textarea.addEventListener('mouseup', evaluateSelection);
    textarea.addEventListener('touchend', () => setTimeout(evaluateSelection, 100));

    floatBtn.addEventListener('click', () => {
      floatBtn.style.display = 'none';
      if (selectedWord) fetchRhymes(selectedWord);
    });

    // Rhyme Fetching & Clipboard Copy
    async function fetchRhymes(word) {
      rhymeTarget.innerText = `Rhymes for: "${word}"`;
      rhymeResults.innerHTML = '<span style="color:var(--muted); font-size:12px;">Loading rhymes...</span>';

      try {
        const res = await fetch(`https://api.datamuse.com/words?rel_rhy=${encodeURIComponent(word)}&max=60`);
        const data = await res.json();
        rhymeResults.innerHTML = '';

        if (!data.length) {
          rhymeResults.innerHTML = '<span style="color:var(--muted); font-size:12px;">No rhymes found.</span>';
          return;
        }

        data.forEach(item => {
          const chip = document.createElement('div');
          chip.className = 'chip';
          chip.innerHTML = `${item.word} <span>${item.numSyllables || 1}s</span>`;
          chip.onclick = () => {
            navigator.clipboard.writeText(item.word).then(() => {
              showToast(`Copied "${item.word}" to clipboard`);
            }).catch(() => {
              showToast(`Failed to copy`);
            });
          };
          rhymeResults.appendChild(chip);
        });
      } catch (err) {
        rhymeResults.innerHTML = '<span style="color:var(--accent); font-size:12px;">Network error.</span>';
      }
    }

    // Save and Version Management
    function promptSave() {
      document.getElementById('save-modal').classList.add('active');
    }
    function closeSaveModal() {
      document.getElementById('save-modal').classList.remove('active');
    }

    function executeSave(type) {
      const song = state.songs.find(s => s.id === state.activeSongId);
      if (!song) return;

      if (type === 'overwrite') {
        const ver = song.versions.find(v => v.id === state.activeVersionId);
        if (ver) {
          ver.content = textarea.value;
          ver.timestamp = Date.now();
          showToast(`Saved (${ver.label} overwritten)`);
        }
      } else if (type === 'new-version') {
        const newVerNum = song.versions.length + 1;
        const newVer = {
          id: 'v_' + Date.now(),
          label: `v${newVerNum}`,
          content: textarea.value,
          timestamp: Date.now()
        };
        song.versions.push(newVer);
        state.activeVersionId = newVer.id;
        document.getElementById('current-version').innerText = newVer.label;
        showToast(`Saved as new version (v${newVerNum})`);
      }
      persist();
      closeSaveModal();
    }

    function newSongPrompt() {
      const title = prompt('Song title:');
      if (!title || !title.trim()) return;
      const newSong = {
        id: 'song_' + Date.now(),
        title: title.trim(),
        versions: [{ id: 'v_' + Date.now(), label: 'v1', content: '', timestamp: Date.now() }]
      };
      state.songs.unshift(newSong);
      mountSong(newSong.id, newSong.versions[0].id);
      showToast(`Created "${newSong.title}"`);
    }

    // Songs Modal & Long Press Implementation
    function openSongsList() {
      const container = document.getElementById('song-list-content');
      container.innerHTML = '';

      state.songs.forEach(song => {
        const row = document.createElement('div');
        row.className = `song-item ${song.id === state.activeSongId ? 'active' : ''}`;
        row.innerHTML = `
          <div>
            <strong>${song.title}</strong>
            <div class="song-meta">${song.versions.length} version${song.versions.length > 1 ? 's' : ''}</div>
          </div>
          <span style="font-size:11px; color:var(--muted);">${song.versions[song.versions.length - 1].label}</span>
        `;

        // Long Press Logic for Versions Menu
        let pressTimer;
        const startPress = (e) => {
          pressTimer = setTimeout(() => {
            triggerVersionMenu(song, e);
          }, 500);
        };
        const cancelPress = () => clearTimeout(pressTimer);

        row.addEventListener('touchstart', startPress, { passive: true });
        row.addEventListener('touchend', cancelPress);
        row.addEventListener('touchmove', cancelPress);
        row.addEventListener('mousedown', startPress);
        row.addEventListener('mouseup', cancelPress);
        row.addEventListener('mouseleave', cancelPress);

        // Standard tap to open default
        row.addEventListener('click', (e) => {
          if (!row.dataset.longPressed) {
            mountSong(song.id, song.versions[song.versions.length - 1].id);
            closeSongsList();
          }
          delete row.dataset.longPressed;
        });

        container.appendChild(row);
      });

      document.getElementById('songs-modal').classList.add('active');
    }

    function closeSongsList() {
      document.getElementById('songs-modal').classList.remove('active');
      versionMenu.style.display = 'none';
    }

    function triggerVersionMenu(song, event) {
      const touch = event.touches ? event.touches[0] : event;
      versionMenu.innerHTML = '';
      
      const header = document.createElement('div');
      header.style.padding = '8px 12px';
      header.style.fontSize = '11px';
      header.style.color = 'var(--muted)';
      header.innerText = `${song.title} - Select Version`;
      versionMenu.appendChild(header);

      song.versions.forEach(v => {
        const item = document.createElement('div');
        item.className = 'version-item';
        item.innerHTML = `<strong>${v.label}</strong> <span style="font-size:11px; color:var(--muted); margin-left:6px;">${new Date(v.timestamp).toLocaleDateString()}</span>`;
        item.onclick = (e) => {
          e.stopPropagation();
          mountSong(song.id, v.id);
          versionMenu.style.display = 'none';
          closeSongsList();
        };
        versionMenu.appendChild(item);
      });

      versionMenu.style.left = `${Math.min(touch.clientX, window.innerWidth - 180)}px`;
      versionMenu.style.top = `${Math.min(touch.clientY, window.innerHeight - 200)}px`;
      versionMenu.style.display = 'block';
    }

    // Close version menu on background tap
    window.addEventListener('click', (e) => {
      if (!versionMenu.contains(e.target)) versionMenu.style.display = 'none';
    });

    // Start App
    loadState();
  </script>
</body>
</html>
