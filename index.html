<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">Hook & Line</title>

  <!-- PWA & Adaptive App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="android-pwa-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="android-pwa-192.png">
  <link rel="shortcut icon" href="android-pwa-192.png">
  <link rel="apple-touch-icon" href="android-playstore-512.png">
  <meta name="theme-color" content="#18191e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #0f1013;
      --surface: #18191e;
      --card: #20222a;
      --border: #2c2e3a;
      --border-light: #3a3d4d;
      --accent: #d9383a;
      --chord-color: #a0a4b5;
      --section-color: #ffd166;
      --text: #f0f1f5;
      --muted: #8b8ea0;
      --editor-line-height: 38px;
    }

    body.hide-chords {
      --editor-line-height: 26px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; }

    /* 1500ms Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #0f1013;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      object-fit: cover;
    }
    .splash-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .splash-title span { color: var(--accent); }
    .splash-tagline {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    /* Fixed Top Studio Header (Locked from collapsing) */
    header {
      height: 48px;
      min-height: 48px;
      max-height: 48px;
      padding: 0 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      z-index: 50;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    .song-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      max-width: 100%;
      min-width: 0;
    }
    .song-title-text { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .version-tag { font-size: 10px; background: #2f3240; color: #b0b4c8; padding: 1px 4px; border-radius: 4px; flex-shrink: 0; }

    .header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-danger { background: #2a1618; border-color: #5c1f24; color: #ff8589; }
    .btn-toggle-active { background: #232738; border-color: #4b526d; color: #8fd2ff; }
    .btn-recording { background: #d9383a !important; color: #fff !important; animation: pulse-red 1.2s infinite ease-in-out; }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(217, 56, 58, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(217, 56, 58, 0); }
      100% { box-shadow: 0 0 0 0 rgba(217, 56, 58, 0); }
    }

    /* Voice Scratchpad Audio Player Bar */
    .memo-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      background: #151720;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      flex-shrink: 0;
    }
    .memo-bar.visible { display: flex; }
    .memo-bar audio { height: 26px; flex: 1; outline: none; }
    .memo-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Collapsible Chords Strip */
    .chord-strip-container {
      background: #14151a;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .chord-strip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .chord-strip-header:active { background: #191b22; }
    .chord-collapse-toggle {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .chord-strip-content {
      display: flex;
      gap: 6px;
      padding: 2px 10px 6px 10px;
      overflow-x: auto;
      white-space: nowrap;
      align-items: center;
    }
    .chord-strip-container.collapsed .chord-strip-content { display: none; }
    .chord-strip-container.collapsed .chord-strip-header { padding: 5px 10px; }

    .chord-divider { width: 1px; height: 18px; background: var(--border-light); margin: 0 2px; flex-shrink: 0; }

    .chord-pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--chord-color);
      font-weight: 700;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chord-pill:active { background: var(--accent); color: #fff; }
    .chord-pill-delete { background: #2a1618; border-color: #5c1f24; color: #ff8589; }

    /* Workspace */
    .workspace { display: flex; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; position: relative; }

    /* Studio Editor */
    .editor-section {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .meter-rail {
      width: 38px;
      background: rgba(0,0,0,0.25);
      border-right: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-family: monospace;
      text-align: right;
      padding: 14px 8px 0 0;
      user-select: none;
      overflow: hidden;
      flex-shrink: 0;
    }
    .meter-item {
      display: block;
      height: var(--editor-line-height);
      line-height: var(--editor-line-height);
      transition: height 0.15s ease, line-height 0.15s ease;
    }
    .meter-item.section-spacer {
      height: 28px;
      line-height: 28px;
      color: transparent;
    }

    #editor-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 16px 28px 16px;
      outline: none;
      font-size: 16px;
      line-height: var(--editor-line-height);
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
      position: relative;
      transition: line-height 0.15s ease;
    }

    #editor-content:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
      pointer-events: none;
      display: block;
    }

    /* Word & Line Count Stats */
    .editor-footer-stats {
      position: absolute;
      bottom: 4px;
      left: 44px;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
      background: rgba(15, 16, 19, 0.85);
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 5;
    }

    /* Section Header Pills - Full Block Isolation */
    .section-header-tag {
      display: block;
      width: fit-content;
      margin: 12px 0 4px 0;
      padding: 2px 8px;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.35);
      color: var(--section-color);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 4px;
      line-height: 18px;
      height: 22px;
      user-select: none;
      cursor: pointer;
    }
    .section-header-tag:hover {
      background: rgba(255, 209, 102, 0.22);
    }

    /* Inline Placed Chords */
    .chord-badge {
      display: inline-block;
      position: relative;
      vertical-align: baseline;
      width: 0;
      overflow: visible;
      user-select: none;
    }

    body.hide-chords .chord-badge {
      display: none !important;
    }

    .chord-badge-inner {
      position: absolute;
      bottom: 14px;
      left: 0;
      font-size: 11px;
      font-weight: 700;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      color: var(--chord-color);
      background: #1e2029;
      border: 1px solid #363949;
      border-radius: 4px;
      padding: 0 4px;
      line-height: 16px;
      height: 16px;
      white-space: nowrap;
      cursor: pointer;
      transform: translateX(-50%);
    }

    .chord-badge.selected .chord-badge-inner {
      background: var(--accent);
      border-color: #ff7b80;
      color: #fff;
      box-shadow: 0 0 8px rgba(217, 56, 58, 0.7);
    }

    /* Floating Action Pin Container */
    .floating-actions {
      position: absolute;
      top: 10px;
      right: 14px;
      display: none;
      z-index: 100;
      gap: 6px;
    }
    .floating-btn {
      background: var(--accent);
      color: #fff;
      border: 1px solid #ff7b80;
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
      cursor: pointer;
    }
    .floating-btn-tag {
      background: #2a2510;
      border-color: var(--section-color);
      color: var(--section-color);
    }

    /* Resizable Reference Drawer */
    .reference-suite {
      height: 44%;
      min-height: 110px;
      max-height: 75%;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      z-index: 10;
      position: relative;
      flex-shrink: 0;
    }

    .resize-handle {
      width: 100%;
      height: 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      cursor: row-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      flex-shrink: 0;
    }
    .resize-handle::after {
      content: "";
      width: 36px;
      height: 4px;
      background: var(--border-light);
      border-radius: 2px;
    }
    .resize-handle:active::after { background: var(--accent); }

    .search-dock { padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .search-dock input {
      flex: 1;
      padding: 6px 10px;
      background: #111215;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }

    .category-pills { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; flex-shrink: 0; }
    .category-btn { background: transparent; border: 1px solid var(--border); border-radius: 14px; color: var(--muted); padding: 3px 9px; font-size: 11px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .category-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* Alliteration A-Z Sub-Bar */
    .alliteration-strip {
      display: none;
      padding: 4px 10px;
      background: #14151a;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      gap: 4px;
      flex-shrink: 0;
    }
    .alliteration-strip.visible { display: flex; }
    .letter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      width: 22px;
      height: 22px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .letter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* MasterWriter Collected Tray */
    .collected-dock {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #121317;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      font-size: 11px;
      flex-shrink: 0;
    }
    .collected-label { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
    .collected-chip {
      background: #232733;
      color: #9ac7ff;
      border: 1px solid #3d465c;
      padding: 2px 7px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .collected-chip:hover { background: #2f3547; }
    .collected-chip .remove-chip { color: var(--muted); font-weight: bold; }

    .dictionary-feed { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .syllable-group-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .syllable-group-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    
    .chips-cluster { display: flex; flex-wrap: wrap; gap: 6px; }

    .word-card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      padding: 5px 9px; 
      font-size: 13px; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      user-select: none;
    }
    .word-card:active { background: var(--accent); color: #fff; }
    .word-card span { font-size: 10px; color: var(--muted); font-family: monospace; }
    .word-card .collect-btn { color: var(--muted); font-size: 12px; margin-left: 2px; }
    .word-card .collect-btn:hover { color: #fff; }

    .phrase-card {
      background: #17181f;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: #e2e4ec;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      user-select: none;
    }
    .phrase-card:active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .phrase-card span { font-size: 10px; color: var(--muted); }

    /* Modals */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 200; }
    .overlay.active { display: flex; }
    .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 440px; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; }
    .dialog-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    
    .catalog-actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #14151a;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      gap: 6px;
    }
    .dialog-body { flex: 1; overflow-y: auto; padding: 10px 12px; }

    .song-row {
      padding: 10px 12px;
      background: #141519;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .song-row.active { border-color: var(--accent); }
    .song-checkbox { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    .song-info { flex: 1; overflow: hidden; }
    .song-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-delete-song { background: transparent; border: 1px solid #4a2125; color: #ff6b70; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }

    .popover-menu { position: fixed; background: #20222a; border: 1px solid var(--border-light); border-radius: 8px; z-index: 300; display: none; min-width: 180px; }
    .popover-item { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .popover-item:last-child { border-bottom: none; }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(30, 32, 40, 0.95); border: 1px solid var(--border-light); color: #fff; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 20px; z-index: 500; display: none; }

    /* Print Output */
    #all-songs-print-container { display: none; }
    .song-print-block { page-break-after: always; padding: 24px 0; }
    .song-print-block:last-child { page-break-after: auto; }
    .song-print-title { font-size: 24px; font-weight: 800; margin-bottom: 16px; color: #000; border-bottom: 2px solid #ddd; padding-bottom: 6px; }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      header, .chord-strip-container, .meter-rail, .reference-suite, .floating-actions, .overlay, .popover-menu, #toast, #splash-screen, .editor-footer-stats, .memo-bar { display: none !important; }
      #editor-content { display: none !important; }
      #all-songs-print-container { display: block !important; padding: 0 !important; }
      .section-header-tag { color: #885e00 !important; background: transparent !important; border: 1px solid #885e00 !important; font-size: 11px !important; }
      .chord-print-label { color: #555 !important; font-size: 11px !important; font-weight: 700 !important; font-family: monospace !important; }
      .lyric-print-text { color: #000 !important; font-size: 15px !important; }
    }
  </style>
</head>
<body>

  <!-- 1500ms Splash Screen -->
  <div id="splash-screen">
    <img src="android-playstore-512.png" alt="Hook & Line" class="splash-logo" onerror="this.style.display='none'">
    <div class="splash-title">Hook <span>&</span> Line</div>
    <div class="splash-tagline">Songwriting & Lyric Studio</div>
  </div>

  <header>
    <div class="header-left">
      <div class="song-pill" onclick="openSongCatalog()">
        <span class="song-title-text" id="active-title">Untitled Song 1</span>
        <span class="version-tag" id="active-version-tag">v1</span>
      </div>
    </div>
    <div class="header-actions">
      <!-- Record Audio Memo & Transcribe -->
      <button class="btn" id="record-btn" onclick="toggleAudioRecording()">🎙️ Rec</button>
      <button class="btn" id="chord-visibility-btn" onclick="toggleChordVisibility()">Chords: On</button>
      <button class="btn" onclick="exportSinglePDF()">PDF</button>
      <button class="btn btn-accent" onclick="openSaveDialog()">Save</button>
    </div>
  </header>

  <!-- Audio Voice Memo Bar -->
  <div class="memo-bar" id="memo-bar">
    <span style="font-weight:700; color:var(--muted); font-size:10px;">MEMO:</span>
    <audio id="memo-audio" controls></audio>
    <button class="memo-btn" onclick="deleteAudioMemo()">Delete</button>
  </div>

  <!-- Collapsible Complete Chords Strip -->
  <div class="chord-strip-container collapsed" id="chord-strip-container">
    <div class="chord-strip-header" onclick="toggleChordsCollapse()">
      <span>Quick Chords (Tap chord to insert/swap)</span>
      <button class="chord-collapse-toggle" id="chord-collapse-btn">Show ▼</button>
    </div>
    <div class="chord-strip-content">
      <!-- Majors -->
      <button class="chord-pill" onclick="insertChordAtCursor('E')">E</button>
      <button class="chord-pill" onclick="insertChordAtCursor('F')">F</button>
      <button class="chord-pill" onclick="insertChordAtCursor('F#')">F#</button>
      <button class="chord-pill" onclick="insertChordAtCursor('G')">G</button>
      <button class="chord-pill" onclick="insertChordAtCursor('G#')">G#</button>
      <button class="chord-pill" onclick="insertChordAtCursor('A')">A</button>
      <button class="chord-pill" onclick="insertChordAtCursor('Bb')">Bb</button>
      <button class="chord-pill" onclick="insertChordAtCursor('B')">B</button>
      <button class="chord-pill" onclick="insertChordAtCursor('C')">C</button>
      <button class="chord-pill" onclick="insertChordAtCursor('C#')">C#</button>
      <button class="chord-pill" onclick="insertChordAtCursor('D')">D</button>
      <button class="chord-pill" onclick="insertChordAtCursor('D#')">D#</button>

      <div class="chord-divider"></div>

      <!-- Minors -->
      <button class="chord-pill" onclick="insertChordAtCursor('Em')">Em</button>
      <button class="chord-pill" onclick="insertChordAtCursor('Fm')">Fm</button>
      <button class="chord-pill" onclick="insertChordAtCursor('F#m')">F#m</button>
      <button class="chord-pill" onclick="insertChordAtCursor('Gm')">Gm</button>
      <button class="chord-pill" onclick="insertChordAtCursor('G#m')">G#m</button>
      <button class="chord-pill" onclick="insertChordAtCursor('Am')">Am</button>

      <button class="chord-pill" onclick="insertChordAtCursor('Bm')">Bm</button>
      <button class="chord-pill" onclick="insertChordAtCursor('Cm')">Cm</button>
      <button class="chord-pill" onclick="insertChordAtCursor('C#m')">C#m</button>
      <button class="chord-pill" onclick="insertChordAtCursor('Dm')">Dm</button>

  <div class="workspace" id="workspace">
    <div class="editor-section">
      <div class="meter-rail" id="meter-rail"></div>
      
      <!-- ContentEditable Studio Editor with dynamic dummy placeholder -->
      <div id="editor-content" contenteditable="true" spellcheck="false" data-placeholder="Start typing lyrics..."></div>
      
      <div class="editor-footer-stats" id="editor-footer-stats">Words: 0 · Lines: 0</div>

      <!-- Floating Action Buttons -->
      <div class="floating-actions" id="floating-actions">
        <button class="floating-btn" id="find-rhymes-btn">Find Rhymes</button>
        <button class="floating-btn floating-btn-tag" onclick="openTagModal()">+ Tag Section</button>

    <!-- Resizable MasterWriter Studio Reference Drawer -->

          <span style="color:var(--muted); font-style:italic;">Tap ⭐ to save ideas here</span>

      <div class="dictionary-feed" id="dictionary-feed">
        <span style="color:var(--muted); font-size:12px;">Mark or select any word to load reference.</span>

  <!-- Section Tagging Modal -->
  <div class="overlay" id="tag-modal">
    <div class="dialog" style="max-width:320px;">
      <div class="dialog-header">
        <strong>Tag Section</strong>

      </div>
      <div class="dialog-body" style="display:flex; flex-direction:column; gap:8px; padding:14px;">
        <button class="btn" style="padding:10px; justify-content:flex-start;" onclick="applySectionTag('verse')">Verse (Auto-numbered)</button>
        <button class="btn" style="padding:10px; justify-content:flex-start;" onclick="applySectionTag('pre-chorus')">Pre-Chorus</button>
        <button class="btn" style="padding:10px; justify-content:flex-start;" onclick="applySectionTag('chorus')">Chorus</button>
        <button class="btn" style="padding:10px; justify-content:flex-start;" onclick="applySectionTag('bridge')">Bridge</button>
        <button class="btn btn-accent" style="padding:10px; justify-content:flex-start;" onclick="promptCustomTag()">+ Custom Tag...</button>
      </div>

  <!-- Song Catalog Modal -->
  <div class="overlay" id="catalog-overlay">
    <div class="dialog">
      <div class="dialog-header">
        <strong>Song Catalog</strong>
        <div style="display:flex; gap:6px;">
          <button class="btn" onclick="createNewSong()">+ New</button>
          <button class="btn" onclick="closeSongCatalog()">Close</button>
        </div>
      </div>
      
      <div class="catalog-actions-bar">
        <div style="display:flex; gap:6px;">
          <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="toggleSelectAll()">Select All</button>
          <button class="btn btn-danger" id="delete-selected-btn" style="padding:4px 8px; font-size:11px; display:none;" onclick="deleteSelectedSongs()">Delete (0)</button>
        </div>
        <button class="btn btn-accent" id="export-selected-btn" style="padding:4px 10px; font-size:11px;" onclick="exportSelectedPDF()">
          Export Selected (0)
        </button>

      <div class="dialog-body" id="catalog-list"></div>

  <div class="popover-menu" id="version-popover"></div>

  <!-- Save Dialog -->
  <div class="overlay" id="save-overlay">
    <div class="dialog">
      <div class="dialog-header">
        <strong>Save Song</strong>
        <button class="btn" onclick="closeSaveDialog()">Cancel</button>
      </div>
      <div class="dialog-body" style="display:flex; flex-direction:column; gap:10px; padding:16px;">
        <button class="btn" style="padding:14px;" onclick="commitSave('overwrite')">Overwrite Current Version</button>
        <button class="btn btn-accent" style="padding:14px;" onclick="commitSave('new-version')">Save as New Version</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let state = { activeSongId: null, activeVersionId: null, songs: [] };
    let collectedIdeas = [];
    let selectedSongIds = new Set();
    let activeFilterMode = 'rel_rhy';
    let selectedLetter = 'A';
    let selectedChordElem = null;
    let savedSelectionRange = null;
    let areChordsVisible = true;

    // Audio & Transcription Variables
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let recognition = null;
    let transcribedText = '';

    const editor = document.getElementById('editor-content');
    const meterRail = document.getElementById('meter-rail');
    const editorStats = document.getElementById('editor-footer-stats');
    const floatActions = document.getElementById('floating-actions');
    const findRhymesBtn = document.getElementById('find-rhymes-btn');
    const queryField = document.getElementById('query-field');
    const dictFeed = document.getElementById('dictionary-feed');
    const versionPopover = document.getElementById('version-popover');
    const chordContainer = document.getElementById('chord-strip-container');
    const chordCollapseBtn = document.getElementById('chord-collapse-btn');
    const chordVisibilityBtn = document.getElementById('chord-visibility-btn');
    const recordBtn = document.getElementById('record-btn');
    const memoBar = document.getElementById('memo-bar');
    const memoAudio = document.getElementById('memo-audio');
    const referenceSuite = document.getElementById('reference-suite');
    const resizeHandle = document.getElementById('resize-handle');
    const workspace = document.getElementById('workspace');
    const splashScreen = document.getElementById('splash-screen');
    const alliterationStrip = document.getElementById('alliteration-strip');
    const collectedContainer = document.getElementById('collected-chips-container');
    let selectedWord = '';

    window.addEventListener('load', () => {
      setTimeout(() => {
        splashScreen.classList.add('fade-out');
        setTimeout(() => splashScreen.remove(), 400);
      }, 1500);
    });

    function init() {
      const stored = localStorage.getItem('hookandline_db');
      if (stored) {
        state = JSON.parse(stored);
      } else {
        const seedSong = {
          id: 's_' + Date.now(),
          title: 'Montreux Session',
          versions: [{
            id: 'v_1',
            label: 'v1',
            html: '<div class="section-header-tag" contenteditable="false" data-type="verse">Verse 1</div><div><span class="chord-badge" contenteditable="false" data-chord="G"><span class="chord-badge-inner">G</span></span>We all came out to <span class="chord-badge" contenteditable="false" data-chord="F"><span class="chord-badge-inner">F</span></span>Montreux</div><div>On the <span class="chord-badge" contenteditable="false" data-chord="G"><span class="chord-badge-inner">G</span></span>shoreline drafting songs</div>',
            audioMemo: null,
            updatedAt: Date.now()
          }]
        };
        state.songs = [seedSong];
        state.activeSongId = seedSong.id;
        state.activeVersionId = 'v_1';
        saveState();
      }

      const storedCollected = localStorage.getItem('hookandline_collected');
      if (storedCollected) {
        collectedIdeas = JSON.parse(storedCollected);
      }

      const isSavedCollapsed = localStorage.getItem('hookandline_chords_collapsed');
      if (isSavedCollapsed === 'false') {
        chordContainer.classList.remove('collapsed');
        chordCollapseBtn.innerText = 'Hide ▲';
      } else {
        chordContainer.classList.add('collapsed');
        chordCollapseBtn.innerText = 'Show ▼';
      }

      const savedVisibility = localStorage.getItem('hookandline_chords_visible');
      if (savedVisibility === 'false') {
        areChordsVisible = false;
        document.body.classList.add('hide-chords');
        chordVisibilityBtn.innerText = 'Chords: Off';
        chordVisibilityBtn.classList.add('btn-toggle-active');
      } else {
        areChordsVisible = true;
        document.body.classList.remove('hide-chords');
        chordVisibilityBtn.innerText = 'Chords: On';
        chordVisibilityBtn.classList.remove('btn-toggle-active');
      }

      const savedHeight = localStorage.getItem('hookandline_drawer_height');
      if (savedHeight) referenceSuite.style.height = savedHeight;

      buildAlliterationBar();
      renderCollected();
      initSpeechRecognition();
      initResizableDrawer();
      loadSong(state.activeSongId, state.activeVersionId);
    }

    // Audio Voice Memo & Speech-to-Text Transcription
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
          let current = '';
          for (let i = e.resultIndex; i < e.results.length; ++i) {
            current += e.results[i][0].transcript;
          }
          transcribedText = current.trim();
        };

        recognition.onerror = () => {};
      }
    }

    async function toggleAudioRecording() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          transcribedText = '';

          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = handleRecordingComplete;

          mediaRecorder.start();
          if (recognition) {
            try { recognition.start(); } catch (err) {}
          }

          isRecording = true;
          recordBtn.innerText = '⏹ Stop';
          recordBtn.classList.add('btn-recording');
          showToast('Recording voice take & transcribing...');
        } catch (err) {
          alert('Microphone access denied or not supported on this browser.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        if (recognition) {
          try { recognition.stop(); } catch (err) {}
        }
        isRecording = false;
        recordBtn.innerText = '🎙️ Rec';
        recordBtn.classList.remove('btn-recording');
      }
    }

    function handleRecordingComplete() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64Audio = reader.result;
        
        const song = state.songs.find(s => s.id === state.activeSongId);
        if (song) {
          const ver = song.versions.find(v => v.id === state.activeVersionId);
          if (ver) {
            ver.audioMemo = base64Audio;
            saveState();
            displayAudioMemo(base64Audio);
          }
        }

        if (transcribedText) {
          const textDiv = document.createElement('div');
          textDiv.innerText = transcribedText;
          editor.appendChild(textDiv);
          updateMeter();
          showToast(`Saved memo & transcribed "${transcribedText.slice(0, 20)}..."`);
        } else {
          showToast('Voice memo saved to song');
        }
      };
      reader.readAsDataURL(audioBlob);
    }

    function displayAudioMemo(audioSrc) {
      if (audioSrc) {
        memoAudio.src = audioSrc;
        memoBar.classList.add('visible');
      } else {
        memoAudio.src = '';
        memoBar.classList.remove('visible');
      }
    }

    function deleteAudioMemo() {
      if (!confirm('Delete this voice recording?')) return;
      const song = state.songs.find(s => s.id === state.activeSongId);
      if (song) {
        const ver = song.versions.find(v => v.id === state.activeVersionId);
        if (ver) {
          ver.audioMemo = null;
          saveState();
          displayAudioMemo(null);
          showToast('Audio memo deleted');
        }
      }
    }

    function buildAlliterationBar() {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      alliterationStrip.innerHTML = '';
      letters.forEach(char => {
        const btn = document.createElement('button');
        btn.className = `letter-btn ${char === selectedLetter ? 'active' : ''}`;
        btn.innerText = char;
        btn.onclick = () => {
          document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedLetter = char;
          const term = queryField.value.trim() || selectedWord || 'heart';
          executeLookup(term);
        };
        alliterationStrip.appendChild(btn);
      });
    }

    function toggleChordVisibility() {
      areChordsVisible = !areChordsVisible;
      if (areChordsVisible) {
        document.body.classList.remove('hide-chords');
        chordVisibilityBtn.innerText = 'Chords: On';
        chordVisibilityBtn.classList.remove('btn-toggle-active');
        showToast('Chords visible');
      } else {
        document.body.classList.add('hide-chords');
        chordVisibilityBtn.innerText = 'Chords: Off';
        chordVisibilityBtn.classList.add('btn-toggle-active');
        showToast('Chords hidden');
      }
      localStorage.setItem('hookandline_chords_visible', areChordsVisible ? 'true' : 'false');
      updateMeter();
    }

    function initResizableDrawer() {
      let isDragging = false;
      let startY = 0;
      let startHeight = 0;

      const startDrag = (clientY) => {
        isDragging = true;
        startY = clientY;
        startHeight = referenceSuite.getBoundingClientRect().height;
        document.body.style.cursor = 'row-resize';
      };

      const doDrag = (clientY) => {
        if (!isDragging) return;
        const delta = startY - clientY;
        const newHeight = startHeight + delta;
        const workspaceHeight = workspace.getBoundingClientRect().height;

        const minHeight = workspaceHeight * 0.15;
        const maxHeight = workspaceHeight * 0.75;

        if (newHeight >= minHeight && newHeight <= maxHeight) {
          const heightPx = `${newHeight}px`;
          referenceSuite.style.height = heightPx;
          localStorage.setItem('hookandline_drawer_height', heightPx);
        }
      };

      const stopDrag = () => {
        if (isDragging) {
          isDragging = false;
          document.body.style.cursor = '';
        }
      };

      resizeHandle.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientY), { passive: true });
      window.addEventListener('touchmove', (e) => { if (isDragging) doDrag(e.touches[0].clientY); }, { passive: false });
      window.addEventListener('touchend', stopDrag);
      window.addEventListener('touchcancel', stopDrag);

      resizeHandle.addEventListener('mousedown', (e) => { e.preventDefault(); startDrag(e.clientY); });
      window.addEventListener('mousemove', (e) => { if (isDragging) doDrag(e.clientY); });
      window.addEventListener('mouseup', stopDrag);
    }

    function toggleChordsCollapse() {
      const isCollapsed = chordContainer.classList.toggle('collapsed');
      chordCollapseBtn.innerText = isCollapsed ? 'Show ▼' : 'Hide ▲';
      localStorage.setItem('hookandline_chords_collapsed', isCollapsed ? 'true' : 'false');
    }

    function saveState() {
      localStorage.setItem('hookandline_db', JSON.stringify(state));
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.innerText = text;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    function sanitizeEditorHTML(rawHtml) {
      if (!rawHtml) return '';
      let clean = rawHtml.replace(/Start typing lyrics\.{3}/gi, '');
      clean = clean.replace(/<div><br><\/div>/gi, '');
      return clean.trim();
    }

    function loadSong(songId, verId) {
      if (!state.songs.length) {
        createNewSong(false);
        return;
      }

      let song = state.songs.find(s => s.id === songId);
      if (!song) {
        song = state.songs[0];
        songId = song.id;
      }
      state.activeSongId = songId;

      const ver = song.versions.find(v => v.id === verId) || song.versions[song.versions.length - 1];
      state.activeVersionId = ver.id;

      document.getElementById('active-title').innerText = song.title;
      document.getElementById('active-version-tag').innerText = ver.label;
      document.title = song.title + ' — Hook & Line';

      editor.innerHTML = sanitizeEditorHTML(ver.html);
      displayAudioMemo(ver.audioMemo || null);
      
      bindChordListeners();
      bindSectionTagListeners();
      renumberVerses();
      updateMeter();
      saveState();
    }

    function bindChordListeners() {
      editor.querySelectorAll('.chord-badge').forEach(badge => {
        badge.onclick = (e) => {
          e.stopPropagation();
          if (selectedChordElem === badge) {
            badge.classList.remove('selected');
            selectedChordElem = null;
          } else {
            if (selectedChordElem) selectedChordElem.classList.remove('selected');
            badge.classList.add('selected');
            selectedChordElem = badge;
          }
        };
      });
    }

    function bindSectionTagListeners() {
      editor.querySelectorAll('.section-header-tag').forEach(tag => {
        tag.onclick = (e) => {
          e.stopPropagation();
          const action = prompt(`Edit section name or type "delete" to remove:`, tag.innerText);
          if (action === null) return;
          if (action.toLowerCase().trim() === 'delete' || action.trim() === '') {
            tag.remove();
          } else {
            tag.innerText = action.trim();
          }
          renumberVerses();
          updateMeter();
        };
      });
    }

    function renumberVerses() {
      let verseCount = 1;
      editor.querySelectorAll('.section-header-tag').forEach(tag => {
        if (tag.dataset.type === 'verse' || /^verse(\s+\d+)?$/i.test(tag.innerText.trim())) {
          tag.dataset.type = 'verse';
          tag.innerText = `Verse ${verseCount++}`;
        }
      });
    }

    function saveCurrentRange() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        savedSelectionRange = sel.getRangeAt(0);
      }
    }

    let selectionTimeout = null;
    document.addEventListener('selectionchange', () => {
      clearTimeout(selectionTimeout);
      selectionTimeout = setTimeout(() => {
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;

        const anchor = sel.anchorNode;
        if (!anchor || !editor.contains(anchor)) {
          floatActions.style.display = 'none';
          return;
        }

        saveCurrentRange();

        const markedText = sel.toString().trim();
        if (markedText.length > 0) {
          const cleanTerm = markedText.replace(/[^a-zA-Z\s]/g, '').trim();
          if (cleanTerm.length > 1) {
            selectedWord = cleanTerm;
            findRhymesBtn.innerText = `Rhymes: "${selectedWord.slice(0, 10)}${selectedWord.length > 10 ? '...' : ''}"`;
            executeLookup(selectedWord);
          }
          floatActions.style.display = 'flex';
          return;
        }
        floatActions.style.display = 'none';
      }, 150);
    });

    editor.addEventListener('input', () => { 
      renumberVerses();
      updateMeter(); 
    });

    function openTagModal() {
      document.getElementById('tag-modal').classList.add('active');
    }
    function closeTagModal() {
      document.getElementById('tag-modal').classList.remove('active');
    }

    function applySectionTag(type, customLabel) {
      closeTagModal();
      floatActions.style.display = 'none';

      let range = savedSelectionRange;
      if (!range) {
        const sel = window.getSelection();
        if (sel.rangeCount > 0) range = sel.getRangeAt(0);
      }

      // Create tag element (block level)
      const tag = document.createElement('div');
      tag.className = 'section-header-tag';
      tag.contentEditable = 'false';
      tag.dataset.type = type;

      if (type === 'verse') tag.innerText = 'Verse';
      else if (type === 'pre-chorus') tag.innerText = 'Pre-Chorus';
      else if (type === 'chorus') tag.innerText = 'Chorus';
      else if (type === 'bridge') tag.innerText = 'Bridge';
      else tag.innerText = customLabel || 'Section';

      // Dedicated blank lyric line directly below
      const nextRow = document.createElement('div');
      nextRow.innerHTML = '<br>';

      if (range) {
        let container = range.startContainer;
        if (container.nodeType === 3) container = container.parentNode;
        
        while (container && container.parentNode !== editor && container !== editor) {
          container = container.parentNode;
        }

        if (container && container !== editor) {
          editor.insertBefore(tag, container);
          editor.insertBefore(nextRow, container);
        } else {
          range.insertNode(nextRow);
          range.insertNode(tag);
        }
      } else {
        editor.prepend(nextRow);
        editor.prepend(tag);
      }

      // Place cursor into the next row
      const newRange = document.createRange();
      newRange.setStart(nextRow, 0);
      newRange.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(newRange);
      savedSelectionRange = newRange;

      bindSectionTagListeners();
      renumberVerses();
      updateMeter();
      showToast(`Added ${tag.innerText}`);
    }

    function promptCustomTag() {
      const custom = prompt('Enter custom section name (e.g. Outro, Solo, Intro):');
      if (custom && custom.trim()) {
        applySectionTag('custom', custom.trim());
      }
    }

    function countSyllables(word) {
      word = word.toLowerCase().replace(/[^a-z]/g, '');
      if (!word) return 0;
      if (word.length <= 3) return 1;
      word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
      word = word.replace(/^y/, '');
      const m = word.match(/[aeiouy]{1,2}/g);
      return m ? m.length : 1;
    }

    function updateMeter() {
      const clone = editor.cloneNode(true);
      clone.querySelectorAll('.chord-badge').forEach(b => b.remove());

      let itemsHtml = '';
      let totalWords = 0;
      let totalLines = 0;

      Array.from(clone.childNodes).forEach(node => {
        if (node.classList && node.classList.contains('section-header-tag')) {
          itemsHtml += '<div class="meter-item section-spacer">·</div>';
          return;
        }

        const text = (node.innerText !== undefined ? node.innerText : node.textContent) || '';
        const lines = text.split('\n');

        lines.forEach((lineText, idx) => {
          if (idx > 0 && lineText === '' && lines.length === 2) return;
          const clean = lineText.trim();
          if (!clean) {
            itemsHtml += '<div class="meter-item">·</div>';
          } else {
            totalLines++;
            const words = clean.split(/\s+/).filter(w => w.length > 0);
            totalWords += words.length;
            const count = words.reduce((sum, w) => sum + countSyllables(w), 0);
            itemsHtml += `<div class="meter-item">${count}</div>`;
          }
        });
      });

      meterRail.innerHTML = itemsHtml || '<div class="meter-item">·</div>';
      editorStats.innerText = `Words: ${totalWords} · Lines: ${totalLines}`;
    }

    function insertChordAtCursor(chord) {
      if (selectedChordElem) {
        selectedChordElem.dataset.chord = chord;
        selectedChordElem.querySelector('.chord-badge-inner').innerText = chord;
        selectedChordElem.classList.remove('selected');
        selectedChordElem = null;
        showToast(`Swapped chord to ${chord}`);
        updateMeter();
        return;
      }

      editor.focus();
      let range = savedSelectionRange;
      if (!range) {
        const sel = window.getSelection();
        if (sel.rangeCount > 0) range = sel.getRangeAt(0);
      }

      const badge = document.createElement('span');
      badge.className = 'chord-badge';
      badge.contentEditable = 'false';
      badge.dataset.chord = chord;
      badge.innerHTML = `<span class="chord-badge-inner">${chord}</span>`;

      if (range && editor.contains(range.commonAncestorContainer)) {
        range.deleteContents();
        range.insertNode(badge);

        range.setStartAfter(badge);
        range.setEndAfter(badge);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        savedSelectionRange = range;
      } else {
        editor.appendChild(badge);
      }

      bindChordListeners();
      showToast(`Placed ${chord}`);
      updateMeter();
    }

    function promptCustomChord() {
      const chord = prompt('Enter custom chord (e.g. C#m7, F#sus4, Dadd9):');
      if (chord && chord.trim()) insertChordAtCursor(chord.trim());
    }

    function deleteSelectedChord() {
      if (!selectedChordElem) {
        showToast('Tap a chord badge first to delete it');
        return;
      }
      selectedChordElem.remove();
      selectedChordElem = null;
      showToast('Deleted chord');
      updateMeter();
    }

    window.addEventListener('keydown', (e) => {
      if (selectedChordElem && (e.key === 'Backspace' || e.key === 'Delete')) {
        e.preventDefault();
        deleteSelectedChord();
      }
    });

    findRhymesBtn.addEventListener('click', () => {
      if (selectedWord) {
        executeLookup(selectedWord);
        document.getElementById('reference-suite').scrollIntoView({ behavior: 'smooth' });
      }
      floatActions.style.display = 'none';
    });

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilterMode = btn.dataset.mode;

        if (activeFilterMode === 'alliterations') {
          alliterationStrip.classList.add('visible');
        } else {
          alliterationStrip.classList.remove('visible');
        }

        const term = queryField.value.trim() || selectedWord;
        if (term) executeLookup(term);
      });
    });

    function triggerManualSearch() {
      const q = queryField.value.trim();
      if (q) executeLookup(q);
    }

    function collectWord(word, e) {
      if (e) e.stopPropagation();
      if (!collectedIdeas.includes(word)) {
        collectedIdeas.unshift(word);
        if (collectedIdeas.length > 25) collectedIdeas.pop();
        localStorage.setItem('hookandline_collected', JSON.stringify(collectedIdeas));
        renderCollected();
        showToast(`Collected "${word}"`);
      }
    }

    function removeCollected(word, e) {
      if (e) e.stopPropagation();
      collectedIdeas = collectedIdeas.filter(w => w !== word);
      localStorage.setItem('hookandline_collected', JSON.stringify(collectedIdeas));
      renderCollected();
    }

    function renderCollected() {
      if (collectedIdeas.length === 0) {
        collectedContainer.innerHTML = '<span style="color:var(--muted); font-style:italic;">Tap ⭐ to save ideas here</span>';
        return;
      }
      collectedContainer.innerHTML = collectedIdeas.map(item => `
        <span class="collected-chip" onclick="insertCollectedWord('${item.replace(/'/g, "\\'")}')">
          ${item} <span class="remove-chip" onclick="removeCollected('${item.replace(/'/g, "\\'")}', event)">×</span>
        </span>
      `).join('');
    }

    function insertCollectedWord(word) {
      navigator.clipboard.writeText(word);
      showToast(`Copied "${word}"`);
    }

    // High Quality Datamuse Search with MasterWriter Modes
    async function executeLookup(term) {
      if (!term) return;
      queryField.value = term;
      dictFeed.innerHTML = '<span style="color:var(--muted); font-size:12px;">Searching studio reference for "' + term + '"...</span>';

      try {
        // Phrases (2-word collocations & pairings)
        if (activeFilterMode === 'phrases') {
          const [resBefore, resAfter] = await Promise.all([
            fetch(`https://api.datamuse.com/words?rel_bga=${encodeURIComponent(term)}&md=f&max=40`),
            fetch(`https://api.datamuse.com/words?rel_bgb=${encodeURIComponent(term)}&md=f&max=40`)
          ]);
          const beforeData = await resBefore.json();
          const afterData = await resAfter.json();

          dictFeed.innerHTML = '';
          const phrases = [];
          beforeData.forEach(w => phrases.push(`${term} ${w.word}`));
          afterData.forEach(w => phrases.push(`${w.word} ${term}`));

          if (!phrases.length) {
            dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">No phrase pairings found for "${term}".</span>`;
            return;
          }

          const section = document.createElement('div');
          section.innerHTML = `<div class="syllable-group-title">Word Pairings & Collocations (${phrases.length})</div>`;
          phrases.forEach(phrase => {
            const card = document.createElement('div');
            card.className = 'phrase-card';
            card.innerHTML = `<span>${phrase}</span> <span style="font-size:13px;" onclick="collectWord('${phrase.replace(/'/g, "\\'")}', event)">⭐</span>`;
            card.onclick = () => {
              navigator.clipboard.writeText(phrase);
              showToast(`Copied "${phrase}"`);
            };
            section.appendChild(card);
          });
          dictFeed.appendChild(section);
          return;
        }

        // Idioms & Sayings
        if (activeFilterMode === 'idioms') {
          const [res1, res2] = await Promise.all([
            fetch(`https://api.datamuse.com/words?sp=*+${encodeURIComponent(term)}+*&max=60`),
            fetch(`https://api.datamuse.com/words?sp=*+${encodeURIComponent(term)}&max=40`)
          ]);
          const data1 = await res1.json();
          const data2 = await res2.json();

          const idiomMap = new Map();
          [...data1, ...data2].forEach(item => {
            if (item.word.includes(' ') && !idiomMap.has(item.word)) {
              idiomMap.set(item.word, item);
            }
          });

          dictFeed.innerHTML = '';
          const list = Array.from(idiomMap.values());
          if (!list.length) {
            dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">No idioms or clichés found containing "${term}".</span>`;
            return;
          }

          const section = document.createElement('div');
          section.innerHTML = `<div class="syllable-group-title">Idioms, Clichés & Sayings (${list.length})</div>`;
          list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'phrase-card';
            card.innerHTML = `<span>${item.word}</span> <span style="font-size:13px;" onclick="collectWord('${item.word.replace(/'/g, "\\'")}', event)">⭐</span>`;
            card.onclick = () => {
              navigator.clipboard.writeText(item.word);
              showToast(`Copied "${item.word}"`);
            };
            section.appendChild(card);
          });
          dictFeed.appendChild(section);
          return;
        }

        // Alliterations
        if (activeFilterMode === 'alliterations') {
          const letter = (selectedLetter || 'A').toLowerCase();
          const res = await fetch(`https://api.datamuse.com/words?sp=${letter}*&ml=${encodeURIComponent(term)}&md=f&max=80`);
          const words = await res.json();
          dictFeed.innerHTML = '';

          if (!words.length) {
            dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">No alliterations starting with "${selectedLetter.toUpperCase()}" for "${term}".</span>`;
            return;
          }

          const section = document.createElement('div');
          section.innerHTML = `<div class="syllable-group-title">Alliterations with "${selectedLetter.toUpperCase()}" (${words.length})</div>`;
          const cluster = document.createElement('div');
          cluster.className = 'chips-cluster';

          words.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `${item.word} <span class="collect-btn" onclick="collectWord('${item.word.replace(/'/g, "\\'")}', event)">⭐</span>`;
            card.onclick = () => {
              navigator.clipboard.writeText(item.word);
              showToast(`Copied "${item.word}"`);
            };
            cluster.appendChild(card);
          });
          section.appendChild(cluster);
          dictFeed.appendChild(section);
          return;
        }

        // Rhymes, Near Rhymes, Synonyms, Word Families
        const res = await fetch(`https://api.datamuse.com/words?${activeFilterMode}=${encodeURIComponent(term)}&md=f&max=100`);
        const words = await res.json();
        dictFeed.innerHTML = '';

        if (!words || !words.length) {
          dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">No matches found for "${term}".</span>`;
          return;
        }

        const groups = { '1 Syllable': [], '2 Syllables': [], '3+ Syllables': [] };
        words.forEach(w => {
          const syl = w.numSyllables || countSyllables(w.word);
          if (syl === 1) groups['1 Syllable'].push(w);
          else if (syl === 2) groups['2 Syllables'].push(w);
          else groups['3+ Syllables'].push(w);
        });

        for (const [title, list] of Object.entries(groups)) {
          if (!list.length) continue;
          const section = document.createElement('div');
          section.innerHTML = `<div class="syllable-group-title">${title} (${list.length})</div>`;
          const cluster = document.createElement('div');
          cluster.className = 'chips-cluster';

          list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `${item.word} <span>${item.numSyllables || ''}</span> <span class="collect-btn" onclick="collectWord('${item.word.replace(/'/g, "\\'")}', event)">⭐</span>`;
            card.onclick = () => {
              navigator.clipboard.writeText(item.word);
              showToast(`Copied "${item.word}"`);
            };
            cluster.appendChild(card);
          });

          section.appendChild(cluster);
          dictFeed.appendChild(section);
        }
      } catch (e) {
        dictFeed.innerHTML = '<span style="color:var(--accent); font-size:12px;">Network error. Check connection.</span>';
      }
    }

    function openSaveDialog() { document.getElementById('save-overlay').classList.add('active'); }
    function closeSaveDialog() { document.getElementById('save-overlay').classList.remove('active'); }

    function commitSave(type) {
      const song = state.songs.find(s => s.id === state.activeSongId);
      if (!song) return;

      if (type === 'overwrite') {
        const ver = song.versions.find(v => v.id === state.activeVersionId);
        if (ver) {
          ver.html = editor.innerHTML;
          ver.updatedAt = Date.now();
          showToast(`Saved (${ver.label})`);
        }
      } else if (type === 'new-version') {
        const vNum = song.versions.length + 1;
        const newV = {
          id: 'v_' + Date.now(),
          label: 'v' + vNum,
          html: editor.innerHTML,
          audioMemo: null,
          updatedAt: Date.now()
        };
        song.versions.push(newV);
        state.activeVersionId = newV.id;
        document.getElementById('active-version-tag').innerText = newV.label;
        showToast(`Saved new version (v${vNum})`);
      }
      saveState();
      closeSaveDialog();
    }

    function getNextUntitledSongTitle() {
      let maxNum = 0;
      const regex = /^Untitled Song(?:\s+(\d+))?$/i;
      state.songs.forEach(s => {
        const match = s.title.trim().match(regex);
        if (match) {
          const num = match[1] ? parseInt(match[1], 10) : 1;
          if (num > maxNum) maxNum = num;
        }
      });
      return `Untitled Song ${maxNum + 1}`;
    }

    function createNewSong(promptUser = true) {
      let name = '';
      if (promptUser) {
        const input = prompt('Song title (leave blank for Untitled Song):');
        if (input === null) return;
        name = input.trim();
      }
      
      if (!name) {
        name = getNextUntitledSongTitle();
      }

      const newSong = {
        id: 's_' + Date.now(),
        title: name,
        versions: [{ id: 'v_' + Date.now(), label: 'v1', html: '', audioMemo: null, updatedAt: Date.now() }]
      };
      state.songs.unshift(newSong);
      loadSong(newSong.id, newSong.versions[0].id);
      closeSongCatalog();
      showToast(`Created "${newSong.title}"`);
    }

    function deleteSong(songId, songTitle, e) {
      if (e) e.stopPropagation();
      if (!confirm(`Delete "${songTitle}"? This cannot be undone.`)) return;

      const idx = state.songs.findIndex(s => s.id === songId);
      if (idx !== -1) {
        state.songs.splice(idx, 1);
        selectedSongIds.delete(songId);
        showToast(`Deleted "${songTitle}"`);
        saveState();

        if (songId === state.activeSongId) {
          if (state.songs.length > 0) {
            loadSong(state.songs[0].id, state.songs[0].versions[0].id);
          } else {
            createNewSong(false);
          }
        }
        renderCatalogList();
      }
    }

    function deleteSelectedSongs() {
      if (selectedSongIds.size === 0) return;
      if (!confirm(`Delete all ${selectedSongIds.size} selected songs?`)) return;

      state.songs = state.songs.filter(s => !selectedSongIds.has(s.id));
      showToast(`Deleted ${selectedSongIds.size} songs`);
      selectedSongIds.clear();
      saveState();

      if (!state.songs.some(s => s.id === state.activeSongId)) {
        if (state.songs.length > 0) {
          loadSong(state.songs[0].id, state.songs[0].versions[0].id);
        } else {
          createNewSong(false);
        }
      }

      renderCatalogList();
    }

    function exportSinglePDF() {
      const song = state.songs.find(s => s.id === state.activeSongId);
      const originalTitle = document.title;
      const filename = song ? song.title : 'Song';
      document.title = filename;

      const printContainer = document.getElementById('all-songs-print-container');
      printContainer.innerHTML = `
        <div class="song-print-block">
          <div class="song-print-title">${song.title}</div>
          <div style="font-size:16px; line-height:36px;">${editor.innerHTML}</div>
        </div>
      `;

      window.print();
      setTimeout(() => { document.title = originalTitle; }, 1000);
    }

    function exportSelectedPDF() {
      if (selectedSongIds.size === 0) {
        alert('Please mark at least one song to export.');
        return;
      }

      closeSongCatalog();
      const originalTitle = document.title;
      document.title = selectedSongIds.size === 1 
        ? (state.songs.find(s => selectedSongIds.has(s.id))?.title || 'Song')
        : 'Hook_and_Line_Selection';

      const targetSongs = state.songs.filter(s => selectedSongIds.has(s.id));
      const printContainer = document.getElementById('all-songs-print-container');

      printContainer.innerHTML = targetSongs.map(song => {
        const latestVer = song.versions[song.versions.length - 1];
        return `
          <div class="song-print-block">
            <div class="song-print-title">${song.title} <span style="font-size:12px; font-weight:normal; color:#666;">(${latestVer.label})</span></div>
            <div style="font-size:16px; line-height:36px;">${latestVer.html}</div>
          </div>
        `;
      }).join('');

      window.print();
      setTimeout(() => { document.title = originalTitle; }, 1000);
    }

    function updateSelectedCounter() {
      const exportBtn = document.getElementById('export-selected-btn');
      const deleteBtn = document.getElementById('delete-selected-btn');

      exportBtn.innerText = `Export Selected (${selectedSongIds.size})`;
      deleteBtn.innerText = `Delete (${selectedSongIds.size})`;

      deleteBtn.style.display = selectedSongIds.size > 0 ? 'inline-flex' : 'none';
    }

    function toggleSelectAll() {
      if (selectedSongIds.size === state.songs.length) {
        selectedSongIds.clear();
      } else {
        selectedSongIds = new Set(state.songs.map(s => s.id));
      }
      renderCatalogList();
      updateSelectedCounter();
    }

    function renderCatalogList() {
      const list = document.getElementById('catalog-list');
      list.innerHTML = '';

      if (state.songs.length === 0) {
        list.innerHTML = '<div style="color:var(--muted); text-align:center; padding:20px;">No songs yet. Tap "+ New" above.</div>';
        updateSelectedCounter();
        return;
      }

      state.songs.forEach(song => {
        const item = document.createElement('div');
        item.className = `song-row ${song.id === state.activeSongId ? 'active' : ''}`;
        const isChecked = selectedSongIds.has(song.id);

        item.innerHTML = `
          <input type="checkbox" class="song-checkbox" ${isChecked ? 'checked' : ''}>
          <div class="song-info">
            <div class="song-name">${song.title}</div>
            <div style="font-size:11px; color:var(--muted);">${song.versions.length} versions (Hold for dropdown)</div>
          </div>
          <button class="btn-delete-song" title="Delete Song">🗑️</button>
        `;

        const checkbox = item.querySelector('.song-checkbox');
        checkbox.onclick = (e) => {
          e.stopPropagation();
          if (checkbox.checked) selectedSongIds.add(song.id);
          else selectedSongIds.delete(song.id);
          updateSelectedCounter();
        };

        const deleteBtn = item.querySelector('.btn-delete-song');
        deleteBtn.onclick = (e) => deleteSong(song.id, song.title, e);

        let timer;
        const startPress = e => timer = setTimeout(() => showVersionPopover(song, e), 500);
        const cancelPress = () => clearTimeout(timer);

        item.addEventListener('touchstart', startPress, { passive: true });
        item.addEventListener('touchend', cancelPress);
        item.addEventListener('touchmove', cancelPress);
        item.addEventListener('mousedown', startPress);
        item.addEventListener('mouseup', cancelPress);

        item.onclick = (e) => {
          if (e.target !== checkbox && e.target !== deleteBtn) {
            loadSong(song.id, song.versions[song.versions.length - 1].id);
            closeSongCatalog();
          }
        };

        list.appendChild(item);
      });
      updateSelectedCounter();
    }

    function openSongCatalog() {
      renderCatalogList();
      document.getElementById('catalog-overlay').classList.add('active');
    }

    function closeSongCatalog() {
      document.getElementById('catalog-overlay').classList.remove('active');
      versionPopover.style.display = 'none';
    }

    function showVersionPopover(song, evt) {
      const touch = evt.touches ? evt.touches[0] : evt;
      versionPopover.innerHTML = `<div style="padding:8px 12px; font-size:11px; color:var(--muted);">${song.title} Versions</div>`;
      song.versions.forEach(v => {
        const row = document.createElement('div');
        row.className = 'popover-item';
        row.innerHTML = `<strong>${v.label}</strong> <span style="font-size:11px; color:var(--muted); margin-left:8px;">${new Date(v.updatedAt).toLocaleDateString()}</span>`;
        row.onclick = e => {
          e.stopPropagation();
          loadSong(song.id, v.id);
          closeSongCatalog();
        };
        versionPopover.appendChild(row);
      });
      versionPopover.style.left = `${Math.min(touch.clientX, window.innerWidth - 190)}px`;
      versionPopover.style.top = `${Math.min(touch.clientY, window.innerHeight - 200)}px`;
      versionPopover.style.display = 'block';
    }

    window.addEventListener('click', e => {
      if (!versionPopover.contains(e.target)) versionPopover.style.display = 'none';
    });

    init();
  </script>
</body>
</html>
