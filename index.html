<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">Mr. Writer Studio</title>
  <style>
    :root {
      --bg: #0f1013;
      --surface: #18191e;
      --card: #20222a;
      --border: #2c2e3a;
      --border-light: #3a3d4d;
      --accent: #d9383a;
      --chord-color: #a0a4b5;
      --text: #f0f1f5;
      --muted: #8b8ea0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Top Studio Bar */
    header {
      height: 52px;
      padding: 0 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .brand { font-weight: 800; font-size: 15px; letter-spacing: -0.5px; }
    .brand span { color: var(--accent); }
    .song-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      max-width: 140px;
    }
    .song-title-text { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .version-tag { font-size: 10px; background: #2f3240; color: #b0b4c8; padding: 1px 5px; border-radius: 4px; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-danger { background: #2a1618; border-color: #5c1f24; color: #ff8589; }

    /* Collapsible Chords Strip */
    .chord-strip-container {
      background: #14151a;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .chord-strip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .chord-strip-header:active { background: #191b22; }
    .chord-collapse-toggle {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .chord-strip-items {
      display: flex;
      gap: 6px;
      padding: 0 12px 6px 12px;
      overflow-x: auto;
      white-space: nowrap;
      align-items: center;
    }
    .chord-strip-container.collapsed .chord-strip-items { display: none; }
    .chord-strip-container.collapsed .chord-strip-header { padding: 5px 12px; }

    .chord-pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--chord-color);
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .chord-pill:active { background: var(--accent); color: #fff; }
    .chord-pill-delete { background: #2a1618; border-color: #5c1f24; color: #ff8589; }

    /* Workspace */
    .workspace { display: flex; flex: 1; flex-direction: column; overflow: hidden; position: relative; }
    @media(min-width: 900px) { .workspace { flex-direction: row; } }

    /* Interactive Studio Editor */
    .editor-section {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .meter-rail {
      width: 32px;
      background: rgba(0,0,0,0.25);
      border-right: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-family: monospace;
      line-height: 48px;
      text-align: right;
      padding: 12px 6px 0 0;
      user-select: none;
    }

    .studio-lines-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .line-block {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chord-lane {
      height: 16px;
      line-height: 16px;
      position: relative;
      user-select: none;
      pointer-events: auto;
    }

    .chord-tag {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      font-family: 'SF Mono', Menlo, monospace;
      color: var(--chord-color);
      background: #1c1d24;
      padding: 0 4px;
      border-radius: 4px;
      border: 1px solid #333644;
      cursor: pointer;
      transform: translateY(-2px);
      z-index: 5;
    }
    .chord-tag.selected {
      background: var(--accent);
      border-color: #ff6b70;
      color: #fff;
      box-shadow: 0 0 8px rgba(217, 56, 58, 0.7);
    }

    .lyric-input-line {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 24px;
      width: 100%;
    }

    /* Fixed Prominent Mobile Rhyme Trigger */
    #selection-rhyme-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      display: none;
      z-index: 100;
      background: var(--accent);
      color: #fff;
      border: 1px solid #ff7b80;
      border-radius: 18px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
      cursor: pointer;
    }

    /* Reference Drawer */
    .reference-suite {
      height: 48%;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    @media(min-width: 900px) {
      .reference-suite { height: 100%; width: 420px; border-top: none; border-left: 1px solid var(--border); }
    }

    .search-dock { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; }
    .search-dock input {
      flex: 1;
      padding: 8px 12px;
      background: #111215;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }

    .category-pills { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; }
    .category-btn { background: transparent; border: 1px solid var(--border); border-radius: 14px; color: var(--muted); padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .category-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .dictionary-feed { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
    .syllable-group-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .syllable-group-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .chips-cluster { display: flex; flex-wrap: wrap; gap: 6px; }

    .word-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .word-card:active { background: var(--accent); color: #fff; }
    .word-card span { font-size: 10px; color: var(--muted); font-family: monospace; }

    /* Modals & Checkbox Catalog */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 200; }
    .overlay.active { display: flex; }
    .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 440px; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; }
    .dialog-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    
    .catalog-actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #14151a;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      gap: 6px;
    }
    .dialog-body { flex: 1; overflow-y: auto; padding: 10px 12px; }

    .song-row {
      padding: 10px 12px;
      background: #141519;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .song-row.active { border-color: var(--accent); }
    .song-checkbox { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    .song-info { flex: 1; overflow: hidden; }
    .song-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-delete-song {
      background: transparent;
      border: 1px solid #4a2125;
      color: #ff6b70;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .popover-menu { position: fixed; background: #20222a; border: 1px solid var(--border-light); border-radius: 8px; z-index: 300; display: none; min-width: 180px; }
    .popover-item { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .popover-item:last-child { border-bottom: none; }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(30, 32, 40, 0.95); border: 1px solid var(--border-light); color: #fff; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 20px; z-index: 500; display: none; }

    /* Print Output Container */
    #all-songs-print-container { display: none; }
    .song-print-block { page-break-after: always; padding: 24px 0; }
    .song-print-block:last-child { page-break-after: auto; }
    .song-print-title { font-size: 24px; font-weight: 800; margin-bottom: 16px; color: #000; border-bottom: 2px solid #ddd; padding-bottom: 6px; }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      header, .chord-strip-container, .meter-rail, .reference-suite, #selection-rhyme-btn, .overlay, .popover-menu, #toast { display: none !important; }
      .studio-lines-container { display: none !important; }
      #all-songs-print-container { display: block !important; padding: 0 !important; }
      .chord-print-label { color: #555 !important; font-size: 11px !important; font-weight: 700 !important; font-family: monospace !important; }
      .lyric-print-text { color: #000 !important; font-size: 15px !important; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="brand">Mr.<span>Writer</span></div>
      <div class="song-pill" onclick="openSongCatalog()">
        <span class="song-title-text" id="active-title">Untitled</span>
        <span class="version-tag" id="active-version-tag">v1</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="exportSinglePDF()">PDF</button>
      <button class="btn btn-accent" onclick="openSaveDialog()">Save</button>
    </div>
  </header>

  <!-- Collapsible Chords Strip -->
  <div class="chord-strip-container" id="chord-strip-container">
    <div class="chord-strip-header" onclick="toggleChordsCollapse()">
      <span>Quick Chords</span>
      <button class="chord-collapse-toggle" id="chord-collapse-btn">Hide ▲</button>
    </div>
    <div class="chord-strip-items" id="chord-strip-items">
      <button class="chord-pill" onclick="handleChordPress('G')">G</button>
      <button class="chord-pill" onclick="handleChordPress('F')">F</button>
      <button class="chord-pill" onclick="handleChordPress('C')">C</button>
      <button class="chord-pill" onclick="handleChordPress('D')">D</button>
      <button class="chord-pill" onclick="handleChordPress('Am')">Am</button>
      <button class="chord-pill" onclick="handleChordPress('Em')">Em</button>
      <button class="chord-pill" onclick="handleChordPress('Bb')">Bb</button>
      <button class="chord-pill" onclick="promptCustomChord()">+ Custom</button>
      <button class="chord-pill chord-pill-delete" onclick="deleteSelectedChord()">Del ⌫</button>
    </div>
  </div>

  <div class="workspace">
    <div class="editor-section">
      <div class="meter-rail" id="meter-rail"></div>
      
      <!-- Interactive Studio Editor -->
      <div class="studio-lines-container" id="studio-lines"></div>

      <!-- Quick Action Pin -->
      <button id="selection-rhyme-btn">Find Rhymes</button>

      <div id="all-songs-print-container"></div>
    </div>

    <!-- MasterWriter Reference Drawer -->
    <div class="reference-suite" id="reference-suite">
      <div class="search-dock">
        <input type="text" id="query-field" placeholder="Search reference term...">
        <button class="btn btn-accent" onclick="triggerManualSearch()">Find</button>
      </div>

      <div class="category-pills">
        <button class="category-btn active" data-mode="rel_rhy">Rhymes</button>
        <button class="category-btn" data-mode="rel_nry">Near Rhymes</button>
        <button class="category-btn" data-mode="rel_bga">Phrases</button>
        <button class="category-btn" data-mode="rel_syn">Synonyms</button>
        <button class="category-btn" data-mode="rel_trg">Word Families</button>
      </div>

      <div class="dictionary-feed" id="dictionary-feed">
        <span style="color:var(--muted); font-size:12px;">Tap or double-tap any word to load rhymes.</span>
      </div>
    </div>
  </div>

  <!-- Song Catalog Modal -->
  <div class="overlay" id="catalog-overlay">
    <div class="dialog">
      <div class="dialog-header">
        <strong>Song Catalog</strong>
        <div style="display:flex; gap:6px;">
          <button class="btn" onclick="createNewSong()">+ New</button>
          <button class="btn" onclick="closeSongCatalog()">Close</button>
        </div>
      </div>
      
      <div class="catalog-actions-bar">
        <div style="display:flex; gap:6px;">
          <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="toggleSelectAll()">Select All</button>
          <button class="btn btn-danger" id="delete-selected-btn" style="padding:4px 8px; font-size:11px; display:none;" onclick="deleteSelectedSongs()">Delete (0)</button>
        </div>
        <button class="btn btn-accent" id="export-selected-btn" style="padding:4px 10px; font-size:11px;" onclick="exportSelectedPDF()">
          Export Selected (0)
        </button>
      </div>

      <div class="dialog-body" id="catalog-list"></div>
    </div>
  </div>

  <div class="popover-menu" id="version-popover"></div>

  <!-- Save Dialog -->
  <div class="overlay" id="save-overlay">
    <div class="dialog">
      <div class="dialog-header">
        <strong>Save Song</strong>
        <button class="btn" onclick="closeSaveDialog()">Cancel</button>
      </div>
      <div class="dialog-body" style="display:flex; flex-direction:column; gap:10px; padding:16px;">
        <button class="btn" style="padding:14px;" onclick="commitSave('overwrite')">Overwrite Current Version</button>
        <button class="btn btn-accent" style="padding:14px;" onclick="commitSave('new-version')">Save as New Version</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let state = { activeSongId: null, activeVersionId: null, songs: [] };
    let selectedSongIds = new Set();
    let activeFilterMode = 'rel_rhy';

    let currentDocumentLines = [];
    let selectedChordRef = null;
    let activeInputCursor = { lineIdx: 0, charCol: 0 };

    const studioLines = document.getElementById('studio-lines');
    const meterRail = document.getElementById('meter-rail');
    const floatBtn = document.getElementById('selection-rhyme-btn');
    const queryField = document.getElementById('query-field');
    const dictFeed = document.getElementById('dictionary-feed');
    const versionPopover = document.getElementById('version-popover');
    const chordContainer = document.getElementById('chord-strip-container');
    const chordCollapseBtn = document.getElementById('chord-collapse-btn');
    let selectedWord = '';

    function init() {
      const stored = localStorage.getItem('mrwriter_v10');
      if (stored) {
        state = JSON.parse(stored);
      } else {
        const seedSong = {
          id: 's_' + Date.now(),
          title: 'Smoke on the Water',
          versions: [{
            id: 'v_1',
            label: 'v1',
            document: [
              { lyrics: 'We all came out to Montreux', chords: [{ chord: 'G', charCol: 0 }, { chord: 'F', charCol: 11 }, { chord: 'G', charCol: 20 }] },
              { lyrics: 'On the Lake Geneva shoreline', chords: [{ chord: 'F', charCol: 7 }, { chord: 'G', charCol: 19 }] },
              { lyrics: 'To make records with a mobile', chords: [{ chord: 'F', charCol: 8 }, { chord: 'G', charCol: 23 }] },
              { lyrics: 'We didn\'t have much time', chords: [{ chord: 'F', charCol: 10 }, { chord: 'G', charCol: 18 }] },
              { lyrics: 'Frank Zappa and the Mothers', chords: [{ chord: 'G', charCol: 0 }, { chord: 'F', charCol: 12 }, { chord: 'G', charCol: 20 }] },
              { lyrics: 'Were at the best place around', chords: [{ chord: 'F', charCol: 12 }, { chord: 'G', charCol: 23 }] },
              { lyrics: 'But some stupid with a flare gun', chords: [{ chord: 'F', charCol: 9 }, { chord: 'G', charCol: 23 }] },
              { lyrics: 'Burned the place to the ground', chords: [{ chord: 'F', charCol: 11 }, { chord: 'G', charCol: 23 }] }
            ],
            updatedAt: Date.now()
          }]
        };
        state.songs = [seedSong];
        state.activeSongId = seedSong.id;
        state.activeVersionId = 'v_1';
        saveState();
      }

      if (localStorage.getItem('mrwriter_chords_collapsed') === 'true') {
        chordContainer.classList.add('collapsed');
        chordCollapseBtn.innerText = 'Show ▼';
      }

      loadSong(state.activeSongId, state.activeVersionId);
    }

    function toggleChordsCollapse() {
      const isCollapsed = chordContainer.classList.toggle('collapsed');
      chordCollapseBtn.innerText = isCollapsed ? 'Show ▼' : 'Hide ▲';
      localStorage.setItem('mrwriter_chords_collapsed', isCollapsed ? 'true' : 'false');
    }

    function saveState() {
      localStorage.setItem('mrwriter_v10', JSON.stringify(state));
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.innerText = text;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    function loadSong(songId, verId) {
      if (!state.songs.length) {
        createNewSong(false);
        return;
      }

      let song = state.songs.find(s => s.id === songId);
      if (!song) {
        song = state.songs[0];
        songId = song.id;
      }
      state.activeSongId = songId;

      const ver = song.versions.find(v => v.id === verId) || song.versions[song.versions.length - 1];
      state.activeVersionId = ver.id;

      document.getElementById('active-title').innerText = song.title;
      document.getElementById('active-version-tag').innerText = ver.label;
      document.title = song.title;

      currentDocumentLines = JSON.parse(JSON.stringify(ver.document || []));
      if (!currentDocumentLines.length) currentDocumentLines = [{ lyrics: '', chords: [] }];
      
      selectedChordRef = null;
      renderStudio();
      saveState();
    }

    function renderStudio() {
      studioLines.innerHTML = '';

      currentDocumentLines.forEach((lineObj, lineIdx) => {
        const block = document.createElement('div');
        block.className = 'line-block';

        const chordLane = document.createElement('div');
        chordLane.className = 'chord-lane';

        lineObj.chords.forEach((cItem, cIdx) => {
          const chordSpan = document.createElement('span');
          chordSpan.className = 'chord-tag';
          chordSpan.innerText = cItem.chord;
          chordSpan.style.left = `${Math.min(cItem.charCol * 8.8, window.innerWidth - 60)}px`;

          if (selectedChordRef && selectedChordRef.lineIdx === lineIdx && selectedChordRef.chordIdx === cIdx) {
            chordSpan.classList.add('selected');
          }

          chordSpan.onclick = (e) => {
            e.stopPropagation();
            if (selectedChordRef && selectedChordRef.lineIdx === lineIdx && selectedChordRef.chordIdx === cIdx) {
              selectedChordRef = null;
            } else {
              selectedChordRef = { lineIdx, chordIdx: cIdx };
            }
            renderStudio();
          };

          chordLane.appendChild(chordSpan);
        });

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'lyric-input-line';
        input.value = lineObj.lyrics;

        input.onfocus = () => { activeInputCursor.lineIdx = lineIdx; };

        const updateCursorAndDetectWord = () => {
          activeInputCursor.lineIdx = lineIdx;
          activeInputCursor.charCol = input.selectionStart;
          detectWordAtCursor(input);
        };

        input.onkeyup = updateCursorAndDetectWord;
        input.onmouseup = updateCursorAndDetectWord;
        input.onselect = updateCursorAndDetectWord;
        input.ontouchend = () => setTimeout(updateCursorAndDetectWord, 100);

        input.oninput = () => {
          lineObj.lyrics = input.value;
          updateMeter();
        };

        input.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            currentDocumentLines.splice(lineIdx + 1, 0, { lyrics: '', chords: [] });
            renderStudio();
            setTimeout(() => {
              const allInputs = studioLines.querySelectorAll('.lyric-input-line');
              if (allInputs[lineIdx + 1]) allInputs[lineIdx + 1].focus();
            }, 50);
          } else if (e.key === 'Backspace' && input.value === '' && currentDocumentLines.length > 1) {
            e.preventDefault();
            currentDocumentLines.splice(lineIdx, 1);
            renderStudio();
            setTimeout(() => {
              const allInputs = studioLines.querySelectorAll('.lyric-input-line');
              const target = allInputs[Math.max(0, lineIdx - 1)];
              if (target) target.focus();
            }, 50);
          }
        };

        block.appendChild(chordLane);
        block.appendChild(input);
        studioLines.appendChild(block);
      });

      updateMeter();
    }

    // Reliable word detection at cursor or selection
    function detectWordAtCursor(input) {
      let word = '';
      const s = input.selectionStart;
      const e = input.selectionEnd;

      if (s !== e) {
        word = input.value.substring(s, e).trim();
      } else {
        const text = input.value;
        let start = s;
        let end = s;
        while (start > 0 && /\S/.test(text[start - 1])) start--;
        while (end < text.length && /\S/.test(text[end])) end++;
        word = text.substring(start, end).trim();
      }

      word = word.replace(/[^a-zA-Z]/g, '');

      if (word && word.length > 1) {
        selectedWord = word;
        floatBtn.innerText = `Rhymes for "${selectedWord}"`;
        floatBtn.style.display = 'block';
        executeLookup(selectedWord);
      } else {
        floatBtn.style.display = 'none';
      }
    }

    floatBtn.addEventListener('click', () => {
      if (selectedWord) {
        executeLookup(selectedWord);
        document.getElementById('reference-suite').scrollIntoView({ behavior: 'smooth' });
      }
      floatBtn.style.display = 'none';
    });

    function handleChordPress(chord) {
      if (selectedChordRef) {
        currentDocumentLines[selectedChordRef.lineIdx].chords[selectedChordRef.chordIdx].chord = chord;
        showToast(`Swapped chord to ${chord}`);
        selectedChordRef = null;
        renderStudio();
        return;
      }

      const targetLine = currentDocumentLines[activeInputCursor.lineIdx];
      if (!targetLine) return;

      let col = activeInputCursor.charCol;
      while (col > 0 && /\S/.test(targetLine.lyrics[col - 1])) {
        col--;
      }

      targetLine.chords.push({ chord, charCol: col });
      targetLine.chords.sort((a, b) => a.charCol - b.charCol);

      showToast(`Inserted ${chord} above word`);
      renderStudio();
    }

    function promptCustomChord() {
      const chord = prompt('Enter custom chord:');
      if (chord && chord.trim()) handleChordPress(chord.trim());
    }

    function deleteSelectedChord() {
      if (!selectedChordRef) {
        showToast('Tap a chord first to delete it');
        return;
      }
      currentDocumentLines[selectedChordRef.lineIdx].chords.splice(selectedChordRef.chordIdx, 1);
      selectedChordRef = null;
      showToast('Deleted chord');
      renderStudio();
    }

    window.addEventListener('keydown', (e) => {
      if (selectedChordRef && (e.key === 'Backspace' || e.key === 'Delete')) {
        e.preventDefault();
        deleteSelectedChord();
      }
    });

    function countSyllables(word) {
      word = word.toLowerCase().replace(/[^a-z]/g, '');
      if (!word) return 0;
      if (word.length <= 3) return 1;
      word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
      word = word.replace(/^y/, '');
      const m = word.match(/[aeiouy]{1,2}/g);
      return m ? m.length : 1;
    }

    function updateMeter() {
      meterRail.innerHTML = currentDocumentLines.map(line => {
        const clean = line.lyrics.trim();
        if (!clean) return '&nbsp;';
        const words = clean.split(/\s+/);
        return words.reduce((sum, w) => sum + countSyllables(w), 0);
      }).join('<br>');
    }

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilterMode = btn.dataset.mode;
        if (queryField.value.trim()) executeLookup(queryField.value.trim());
      });
    });

    function triggerManualSearch() {
      const q = queryField.value.trim();
      if (q) executeLookup(q);
    }

    // Datamuse lookup with fallback
    async function executeLookup(term) {
      if (!term) return;
      queryField.value = term;
      dictFeed.innerHTML = '<span style="color:var(--muted); font-size:12px;">Searching database for "' + term + '"...</span>';

      try {
        const url = `https://api.datamuse.com/words?${activeFilterMode}=${encodeURIComponent(term)}&max=100`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network error');
        const words = await res.json();
        dictFeed.innerHTML = '';

        if (!words || !words.length) {
          dictFeed.innerHTML = `<span style="color:var(--muted); font-size:12px;">No results found for "${term}". Try "Near Rhymes" tab.</span>`;
          return;
        }

        const groups = { '1 Syllable': [], '2 Syllables': [], '3+ Syllables': [] };
        words.forEach(w => {
          const syl = w.numSyllables || countSyllables(w.word);
          if (syl === 1) groups['1 Syllable'].push(w);
          else if (syl === 2) groups['2 Syllables'].push(w);
          else groups['3+ Syllables'].push(w);
        });

        for (const [title, list] of Object.entries(groups)) {
          if (!list.length) continue;
          const section = document.createElement('div');
          section.innerHTML = `<div class="syllable-group-title">${title} (${list.length})</div>`;
          const cluster = document.createElement('div');
          cluster.className = 'chips-cluster';

          list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `${item.word} <span>${item.numSyllables || ''}</span>`;
            card.onclick = () => {
              navigator.clipboard.writeText(item.word);
              showToast(`Copied "${item.word}" to clipboard`);
            };
            cluster.appendChild(card);
          });

          section.appendChild(cluster);
          dictFeed.appendChild(section);
        }
      } catch (e) {
        dictFeed.innerHTML = '<span style="color:var(--accent); font-size:12px;">Offline or network connection error. Check data/WiFi.</span>';
      }
    }

    // Save & Catalog Management
    function openSaveDialog() { document.getElementById('save-overlay').classList.add('active'); }
    function closeSaveDialog() { document.getElementById('save-overlay').classList.remove('active'); }

    function commitSave(type) {
      const song = state.songs.find(s => s.id === state.activeSongId);
      if (!song) return;

      if (type === 'overwrite') {
        const ver = song.versions.find(v => v.id === state.activeVersionId);
        if (ver) {
          ver.document = JSON.parse(JSON.stringify(currentDocumentLines));
          ver.updatedAt = Date.now();
          showToast(`Saved (${ver.label})`);
        }
      } else if (type === 'new-version') {
        const vNum = song.versions.length + 1;
        const newV = {
          id: 'v_' + Date.now(),
          label: 'v' + vNum,
          document: JSON.parse(JSON.stringify(currentDocumentLines)),
          updatedAt: Date.now()
        };
        song.versions.push(newV);
        state.activeVersionId = newV.id;
        document.getElementById('active-version-tag').innerText = newV.label;
        showToast(`Saved new version (v${vNum})`);
      }
      saveState();
      closeSaveDialog();
    }

    function createNewSong(promptUser = true) {
      let name = 'Untitled Song';
      if (promptUser) {
        const input = prompt('Song title:');
        if (!input || !input.trim()) return;
        name = input.trim();
      }
      const newSong = {
        id: 's_' + Date.now(),
        title: name,
        versions: [{ id: 'v_' + Date.now(), label: 'v1', document: [{ lyrics: '', chords: [] }], updatedAt: Date.now() }]
      };
      state.songs.unshift(newSong);
      loadSong(newSong.id, newSong.versions[0].id);
      closeSongCatalog();
      showToast(`Created "${newSong.title}"`);
    }

    function deleteSong(songId, songTitle, e) {
      if (e) e.stopPropagation();
      if (!confirm(`Delete "${songTitle}"? This cannot be undone.`)) return;

      const idx = state.songs.findIndex(s => s.id === songId);
      if (idx !== -1) {
        state.songs.splice(idx, 1);
        selectedSongIds.delete(songId);
        showToast(`Deleted "${songTitle}"`);
        saveState();

        if (songId === state.activeSongId) {
          if (state.songs.length > 0) {
            loadSong(state.songs[0].id, state.songs[0].versions[0].id);
          } else {
            createNewSong(false);
          }
        }
        renderCatalogList();
      }
    }

    function deleteSelectedSongs() {
      if (selectedSongIds.size === 0) return;
      if (!confirm(`Delete all ${selectedSongIds.size} selected songs?`)) return;

      state.songs = state.songs.filter(s => !selectedSongIds.has(s.id));
      showToast(`Deleted ${selectedSongIds.size} songs`);
      selectedSongIds.clear();
      saveState();

      if (!state.songs.some(s => s.id === state.activeSongId)) {
        if (state.songs.length > 0) {
          loadSong(state.songs[0].id, state.songs[0].versions[0].id);
        } else {
          createNewSong(false);
        }
      }

      renderCatalogList();
    }

    function generatePrintHTML(documentLines) {
      return documentLines.map(line => {
        let chordLine = '';
        let lastPos = 0;
        line.chords.forEach(c => {
          chordLine += ' '.repeat(Math.max(0, c.charCol - lastPos)) + c.chord;
          lastPos = c.charCol + c.chord.length;
        });

        return `
          <div style="margin-bottom:12px; font-family:monospace; line-height:1.4;">
            <div class="chord-print-label">${chordLine ? chordLine.replace(/\s/g, '&nbsp;') : '&nbsp;'}</div>
            <div class="lyric-print-text">${line.lyrics ? line.lyrics.replace(/\s/g, '&nbsp;') : '&nbsp;'}</div>
          </div>
        `;
      }).join('');
    }

    function exportSinglePDF() {
      const song = state.songs.find(s => s.id === state.activeSongId);
      const originalTitle = document.title;
      const filename = song ? song.title : 'Song';
      document.title = filename;

      const printContainer = document.getElementById('all-songs-print-container');
      printContainer.innerHTML = `
        <div class="song-print-block">
          <div class="song-print-title">${song.title}</div>
          ${generatePrintHTML(currentDocumentLines)}
        </div>
      `;

      window.print();
      setTimeout(() => { document.title = originalTitle; }, 1000);
    }

    function exportSelectedPDF() {
      if (selectedSongIds.size === 0) {
        alert('Please mark at least one song to export.');
        return;
      }

      closeSongCatalog();
      const originalTitle = document.title;
      
      if (selectedSongIds.size === 1) {
        const singleSong = state.songs.find(s => selectedSongIds.has(s.id));
        document.title = singleSong ? singleSong.title : 'Mr_Writer_Song';
      } else {
        document.title = 'Mr_Writer_Selection';
      }

      const targetSongs = state.songs.filter(s => selectedSongIds.has(s.id));
      const printContainer = document.getElementById('all-songs-print-container');

      printContainer.innerHTML = targetSongs.map(song => {
        const latestVer = song.versions[song.versions.length - 1];
        return `
          <div class="song-print-block">
            <div class="song-print-title">${song.title} <span style="font-size:12px; font-weight:normal; color:#666;">(${latestVer.label})</span></div>
            ${generatePrintHTML(latestVer.document || [])}
          </div>
        `;
      }).join('');

      window.print();
      setTimeout(() => { document.title = originalTitle; }, 1000);
    }

    function updateSelectedCounter() {
      const exportBtn = document.getElementById('export-selected-btn');
      const deleteBtn = document.getElementById('delete-selected-btn');

      exportBtn.innerText = `Export Selected (${selectedSongIds.size})`;
      deleteBtn.innerText = `Delete (${selectedSongIds.size})`;

      if (selectedSongIds.size > 0) {
        deleteBtn.style.display = 'inline-flex';
      } else {
        deleteBtn.style.display = 'none';
      }
    }

    function toggleSelectAll() {
      if (selectedSongIds.size === state.songs.length) {
        selectedSongIds.clear();
      } else {
        selectedSongIds = new Set(state.songs.map(s => s.id));
      }
      renderCatalogList();
      updateSelectedCounter();
    }

    function renderCatalogList() {
      const list = document.getElementById('catalog-list');
      list.innerHTML = '';

      if (state.songs.length === 0) {
        list.innerHTML = '<div style="color:var(--muted); text-align:center; padding:20px;">No songs yet. Tap "+ New" above.</div>';
        updateSelectedCounter();
        return;
      }

      state.songs.forEach(song => {
        const item = document.createElement('div');
        item.className = `song-row ${song.id === state.activeSongId ? 'active' : ''}`;
        const isChecked = selectedSongIds.has(song.id);

        item.innerHTML = `
          <input type="checkbox" class="song-checkbox" ${isChecked ? 'checked' : ''}>
          <div class="song-info">
            <div class="song-name">${song.title}</div>
            <div style="font-size:11px; color:var(--muted);">${song.versions.length} versions (Hold for dropdown)</div>
          </div>
          <button class="btn-delete-song" title="Delete Song">🗑️</button>
        `;

        const checkbox = item.querySelector('.song-checkbox');
        checkbox.onclick = (e) => {
          e.stopPropagation();
          if (checkbox.checked) selectedSongIds.add(song.id);
          else selectedSongIds.delete(song.id);
          updateSelectedCounter();
        };

        const deleteBtn = item.querySelector('.btn-delete-song');
        deleteBtn.onclick = (e) => deleteSong(song.id, song.title, e);

        let timer;
        const startPress = e => timer = setTimeout(() => showVersionPopover(song, e), 500);
        const cancelPress = () => clearTimeout(timer);

        item.addEventListener('touchstart', startPress, { passive: true });
        item.addEventListener('touchend', cancelPress);
        item.addEventListener('touchmove', cancelPress);
        item.addEventListener('mousedown', startPress);
        item.addEventListener('mouseup', cancelPress);

        item.onclick = (e) => {
          if (e.target !== checkbox && e.target !== deleteBtn) {
            loadSong(song.id, song.versions[song.versions.length - 1].id);
            closeSongCatalog();
          }
        };

        list.appendChild(item);
      });
      updateSelectedCounter();
    }

    function openSongCatalog() {
      renderCatalogList();
      document.getElementById('catalog-overlay').classList.add('active');
    }

    function closeSongCatalog() {
      document.getElementById('catalog-overlay').classList.remove('active');
      versionPopover.style.display = 'none';
    }

    function showVersionPopover(song, evt) {
      const touch = evt.touches ? evt.touches[0] : evt;
      versionPopover.innerHTML = `<div style="padding:8px 12px; font-size:11px; color:var(--muted);">${song.title} Versions</div>`;
      song.versions.forEach(v => {
        const row = document.createElement('div');
        row.className = 'popover-item';
        row.innerHTML = `<strong>${v.label}</strong> <span style="font-size:11px; color:var(--muted); margin-left:8px;">${new Date(v.updatedAt).toLocaleDateString()}</span>`;
        row.onclick = e => {
          e.stopPropagation();
          loadSong(song.id, v.id);
          closeSongCatalog();
        };
        versionPopover.appendChild(row);
      });
      versionPopover.style.left = `${Math.min(touch.clientX, window.innerWidth - 190)}px`;
      versionPopover.style.top = `${Math.min(touch.clientY, window.innerHeight - 200)}px`;
      versionPopover.style.display = 'block';
    }

    window.addEventListener('click', e => {
      if (!versionPopover.contains(e.target)) versionPopover.style.display = 'none';
    });

    init();
  </script>
</body>
</html>
